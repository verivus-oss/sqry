[package]
name = "sqry-lang-php"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "PHP language plugin for sqry"

[dependencies]
sqry-core = { version = "11.0.3", path = "../sqry-core" }
anyhow.workspace = true
tree-sitter.workspace = true
tree-sitter-php.workspace = true
streaming-iterator.workspace = true
once_cell.workspace = true
sqry-lang-support = { version = "11.0.3", path = "../sqry-lang-support" }

[dev-dependencies]
log.workspace = true
sqry-core = { path = "../sqry-core", features = ["test-support"] }
tempfile = "3.10"
insta = { version = "1.47", features = ["yaml"] }
serial_test = "3.0"
criterion = "0.8"

[features]
default = ["has_relations"]
has_relations = []
