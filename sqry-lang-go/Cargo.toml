[package]
name = "sqry-lang-go"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Go language plugin for sqry"

[dependencies]
sqry-core = { version = "14.0.4", path = "../sqry-core" }
sqry-lang-support = { version = "14.0.4", path = "../sqry-lang-support" }
anyhow.workspace = true
tree-sitter.workspace = true
tree-sitter-go.workspace = true
streaming-iterator.workspace = true

[dev-dependencies]
criterion = "0.8"
log.workspace = true
sqry-core = { path = "../sqry-core", features = ["test-support"] }

[features]
default = ["has_relations"]
has_relations = []
