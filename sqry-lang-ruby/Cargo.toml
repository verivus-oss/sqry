[package]
name = "sqry-lang-ruby"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Ruby language plugin for sqry"

[dependencies]
sqry-core = { version = "4.10.0", path = "../sqry-core" }
anyhow.workspace = true
tree-sitter.workspace = true
tree-sitter-ruby.workspace = true
streaming-iterator.workspace = true
once_cell.workspace = true
sqry-lang-support = { version = "4.10.0", path = "../sqry-lang-support" }

[dev-dependencies]
log.workspace = true
env_logger.workspace = true
sqry-core = { path = "../sqry-core", features = ["test-support"] }
tempfile = "3.10"
insta = { version = "1.34", features = ["yaml"] }
criterion = "0.8"

[features]
default = ["has_relations"]
has_relations = []
