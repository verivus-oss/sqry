name: OSS Release Watchdog

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      threshold_minutes:
        description: 'Cancel runs older than this many minutes (default: 180)'
        required: false
        default: '180'
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: oss-release-watchdog-${{ github.repository }}
  cancel-in-progress: true

jobs:
  cancel-stale-runs:
    name: Cancel stale queued/waiting OSS runs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cancel stale queued/waiting runs
        env:
          GH_TOKEN: ${{ github.token }}
          THRESHOLD_MINUTES: ${{ github.event.inputs.threshold_minutes }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          threshold="${THRESHOLD_MINUTES:-}"
          if [[ -z "$threshold" ]]; then
            threshold="180"
          fi
          if ! [[ "$threshold" =~ ^[0-9]+$ ]]; then
            echo "::error::threshold_minutes must be a positive integer, got '$threshold'"
            exit 1
          fi

          # This workflow file is promoted to both the private and public repos.
          # Keep the live v2 workflow names in one place so future renames do not
          # drift silently from the watchdog.
          workflows=(
            "OSS Leg 1: Dev → Staging"
            "OSS Leg 2: Staging → Public"
            "OSS Leg 3 Release"
          )

          statuses=("queued" "waiting" "requested")
          now_epoch="$(date -u +%s)"
          cancelled=0
          inspected=0
          declare -A seen_ids=()

          echo "Watchdog repository: $REPO"
          echo "Threshold minutes: $threshold"
          echo "Target workflows: ${workflows[*]}"

          for workflow in "${workflows[@]}"; do
            for status in "${statuses[@]}"; do
              runs_json="$(gh run list --workflow "$workflow" --status "$status" --limit 100 --json databaseId,createdAt,status,workflowName,url,displayTitle 2>/dev/null || echo '[]')"
              while IFS= read -r run; do
                run_id="$(jq -r '.databaseId' <<< "$run")"
                created_at="$(jq -r '.createdAt' <<< "$run")"
                run_status="$(jq -r '.status' <<< "$run")"
                run_title="$(jq -r '.displayTitle' <<< "$run")"
                run_url="$(jq -r '.url' <<< "$run")"

                if [[ "$run_id" == "null" || -z "$run_id" ]]; then
                  continue
                fi
                if [[ -n "${seen_ids[$run_id]:-}" ]]; then
                  continue
                fi
                seen_ids["$run_id"]=1
                inspected=$((inspected + 1))

                created_epoch="$(date -u -d "$created_at" +%s 2>/dev/null || echo 0)"
                if [[ "$created_epoch" -eq 0 ]]; then
                  echo "::warning::Could not parse createdAt for run id=$run_id; skipping"
                  continue
                fi

                age_minutes=$(( (now_epoch - created_epoch) / 60 ))
                if (( age_minutes < threshold )); then
                  continue
                fi

                echo "Cancelling stale run id=$run_id status=$run_status age=${age_minutes}m workflow='$workflow' title='$run_title'"
                if gh run cancel "$run_id"; then
                  cancelled=$((cancelled + 1))
                else
                  echo "::warning::Failed to cancel run id=$run_id url=$run_url"
                fi
              done < <(jq -c '.[]' <<< "$runs_json")
            done
          done

          {
            echo "## OSS Release Watchdog"
            echo
            echo "- Repository: \\`$REPO\\`"
            echo "- Threshold: \\`${threshold}\\` minutes"
            echo "- Workflow names inspected:"
            for workflow in "${workflows[@]}"; do
              echo "  - \\`${workflow}\\`"
            done
            echo "- Runs inspected: \\`${inspected}\\`"
            echo "- Runs cancelled: \\`${cancelled}\\`"
            echo
            echo "Only \\`queued\\`, \\`waiting\\`, and \\`requested\\` runs are cancelled."
            echo "\\`in_progress\\` runs are intentionally ignored to avoid partial-release side effects."
          } >> "$GITHUB_STEP_SUMMARY"
