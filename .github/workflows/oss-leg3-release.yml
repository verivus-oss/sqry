# =============================================================================
# OSS Leg 3 Release Workflow — Publication Pipeline v2
#
# Builds, signs, packages, and publishes release artifacts from the PUBLIC
# staging repo (verivus-oss/sqry). Multi-platform, multi-binary architecture
# with Cosign OIDC keyless signing and SLSA Level 2 provenance.
#
# Job Architecture:
#   Job 0 (smoke-tests):           Inlined infra checks (signing, KV, environments)
#   Job 1a (build-linux-x86_64):   Build + Cosign sign — Linux x86_64 (musl static)
#   Job 1b (build-linux-arm64):    Build + Cosign sign — Linux ARM64 (musl static)
#   Job 1c (build-windows-x86_64): Build + Cosign sign + conditional SignPath — Windows x86_64
#   Job 1d (build-macos-arm64):    Build + Apple codesign + notarize + Cosign — macOS ARM64
#   Job 1e (build-vscode):         Package + Cosign sign — VSCode extension
#   Job 2a (package-windows-msi):  WiX .msi + conditional SignPath
#   Job 2b (package-linux-deb):    .deb package
#   Job 2c (package-linux-rpm):    .rpm package
#   provenance-*:                  SLSA Level 2 provenance (per platform)
#   publish:                       Verify + GitHub Release + Open VSX publish
#
# IMPORTANT: This workflow runs on and MUST be dispatched from verivus-oss/sqry.
#   The Cosign certificate identity encodes the repository where the workflow runs.
#   Dispatching from any other repo produces a cert identity mismatch.
#
#   In the GitHub UI: verivus-oss/sqry -> Actions -> OSS Leg 3 Release ->
#     Run workflow -> select the release tag ref (not a branch).
#
# Trigger: Manual via workflow_dispatch only (must select the release tag as ref)
#
# Design ref: Publication Pipeline v2
# =============================================================================

name: OSS Leg 3 Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g., v4.2.0) — dispatch from this tag ref'
        required: true
        type: string
      enable_signpath:
        description: 'Enable SignPath Authenticode signing for Windows binaries and MSI'
        required: false
        default: false
        type: boolean
      enable_apple_signing:
        description: 'Enable Apple Developer ID code signing and notarization for macOS'
        required: false
        default: false
        type: boolean

concurrency:
  group: oss-leg3-release
  cancel-in-progress: false

# Top-level permissions — individual jobs may further restrict.
permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  # ===========================================================================
  # Job 0: Smoke Tests (INLINED)
  #
  # This workflow runs on the PUBLIC repo (verivus-oss/sqry) which CANNOT call
  # the reusable oss-smoke-tests.yml (that lives in the private repo).
  # All smoke checks are inlined here.
  # ===========================================================================
  smoke-tests:
    name: Smoke Tests (Inlined)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      # --- Validate version tag format ---
      - name: Validate version tag format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format: '$VERSION'. Must match v<MAJOR>.<MINOR>.<PATCH>"
            exit 1
          fi
          echo "Version format '$VERSION' validated"

      # --- Enforce dispatch from tag ref ---
      # Cosign certificate identity encodes github.ref — must be refs/tags/<version>.
      - name: Enforce dispatch from tag ref
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::This workflow must be dispatched from a tag ref, not a branch."
            echo "::error::Current ref type: '$REF_TYPE', ref name: '$REF_NAME'"
            echo "::error::In the GitHub UI, select the '$VERSION' tag from the 'Run workflow' branch/tag dropdown."
            exit 1
          fi
          if [ "$REF_NAME" != "$VERSION" ]; then
            echo "::error::Dispatch ref '$REF_NAME' does not match requested version '$VERSION'."
            echo "::error::Select the '$VERSION' tag from the branch/tag dropdown when dispatching."
            exit 1
          fi
          echo "Dispatch ref validated: refs/tags/${VERSION}"

      # --- Checkout public repo at tag ---
      - name: Checkout public repo at tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 1

      # --- Verify tag checkout ---
      - name: Verify tag checkout
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! git describe --tags --exact-match 2>/dev/null | grep -qE "^${VERSION}$"; then
            echo "::error::Checkout does not match tag '$VERSION'"
            exit 1
          fi
          echo "Tag '$VERSION' verified at $(git rev-parse --short HEAD)"

      # --- Check: GitHub environments exist ---
      - name: "Check: GitHub environments exist"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for env_name in oss-signing oss-release; do
            if gh api "repos/${REPO}/environments/${env_name}" --silent 2>/dev/null; then
              echo "::notice::Environment '${env_name}' exists on ${REPO}"
            else
              echo "::error::Environment '${env_name}' NOT found on ${REPO}"
              exit 1
            fi
          done

      # --- Check: Cosign installable ---
      - name: "Check: Cosign availability"
        run: |
          # Verify we can download cosign — fail fast if network/release issues
          curl -fsSL "https://github.com/sigstore/cosign/releases/latest" -o /dev/null
          echo "::notice::Cosign release endpoint reachable"

      # --- Check: No internal org references in source ---
      - name: "Check: No internal org references"
        run: |
          echo "Scanning for internal org references..."
          FAIL=0
          if grep -rqna --exclude='sbom-*-cyclonedx.json' 'verivusai-labs' . --exclude-dir='.github' --exclude-dir='.git' 2>/dev/null; then
            echo "::error::Source contains verivusai-labs references"
            grep -rna --exclude='sbom-*-cyclonedx.json' 'verivusai-labs' . --exclude-dir='.github' --exclude-dir='.git' 2>/dev/null | head -20
            FAIL=1
          fi
          if grep -rqna --exclude='sbom-*-cyclonedx.json' 'verivusai-open' . --exclude-dir='.github' --exclude-dir='.git' 2>/dev/null; then
            echo "::error::Source contains verivusai-open references"
            grep -rna --exclude='sbom-*-cyclonedx.json' 'verivusai-open' . --exclude-dir='.github' --exclude-dir='.git' 2>/dev/null | head -20
            FAIL=1
          fi
          if grep -rqna '/srv/repos/internal' . --exclude-dir='.github' --exclude-dir='.git' 2>/dev/null; then
            echo "::error::Source contains internal absolute paths"
            grep -rna '/srv/repos/internal' . --exclude-dir='.github' --exclude-dir='.git' 2>/dev/null | head -20
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Internal reference check failed"
            exit 1
          fi
          echo "No internal org references found"

      # --- Check: Required public docs present ---
      - name: "Check: Required public docs present"
        run: |
          FAIL=0
          for doc in README.md LICENSE CHANGELOG.md CONTRIBUTING.md; do
            if [ ! -f "$doc" ]; then
              echo "::warning::Missing $doc"
              FAIL=1
            fi
          done
          if [ $FAIL -ne 0 ]; then
            echo "::error::Required public documentation missing"
            exit 1
          fi
          echo "Required public docs verified"

      # --- Summary ---
      - name: Post smoke test summary
        if: always()
        run: |
          {
            echo "## Leg 3 Smoke Test Results"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Version format | \`${RELEASE_VERSION}\` |"
            echo "| Tag-ref dispatch | verified |"
            echo "| Environments (oss-signing, oss-release) | checked |"
            echo "| Internal reference scan | passed |"
            echo "| Required public docs | present |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Job 1a: Build + Sign — Linux x86_64 (musl, static, jemalloc)
  # Produces: sqry-linux-x86_64, sqry-mcp-linux-x86_64, sqry-lsp-linux-x86_64
  # ===========================================================================
  build-linux-x86_64:
    name: Build + Sign — Linux x86_64
    needs: smoke-tests
    runs-on: ubuntu-22.04
    environment: oss-signing
    permissions:
      contents: read
      id-token: write
    outputs:
      subjects: ${{ steps.hash.outputs.subjects }}

    steps:
      - name: Validate version and enforce tag ref
        env:
          VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format: '$VERSION'"
            exit 1
          fi
          if [ "$REF_TYPE" != "tag" ] || [ "$REF_NAME" != "$VERSION" ]; then
            echo "::error::Must be dispatched from tag ref '$VERSION'"
            exit 1
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Python /opt/hostedtoolcache/Ruby \
            /usr/local/share/powershell /usr/share/swift
          df -h /

      - name: Checkout public repo at tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 1
          path: source

      - name: Verify tag checkout
        working-directory: source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! git describe --tags --exact-match 2>/dev/null | grep -qE "^${VERSION}$"; then
            echo "::error::Checkout does not match tag '$VERSION'"
            exit 1
          fi
          echo "Tag '$VERSION' verified at $(git rev-parse --short HEAD)"

      - name: Install musl toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          musl-gcc --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.90"
          targets: x86_64-unknown-linux-musl

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: source
          key: x86_64-unknown-linux-musl

      - name: Build release binaries (musl static)
        working-directory: source
        env:
          CARGO_BUILD_JOBS: "2"
          RUSTFLAGS: "-Csplit-debuginfo=unpacked -Ctarget-feature=+crt-static"
          JEMALLOC_SYS_WITH_LG_PAGE: "12"
        run: |
          cargo build --release \
            --target x86_64-unknown-linux-musl \
            -p sqry-cli \
            -p sqry-mcp \
            -p sqry-lsp
          echo "Release binaries built successfully"
          ls -lh target/x86_64-unknown-linux-musl/release/sqry \
                  target/x86_64-unknown-linux-musl/release/sqry-mcp \
                  target/x86_64-unknown-linux-musl/release/sqry-lsp
          # Verify static linking
          file target/x86_64-unknown-linux-musl/release/sqry
          ldd target/x86_64-unknown-linux-musl/release/sqry 2>&1 | grep -q "not a dynamic executable" || \
            ldd target/x86_64-unknown-linux-musl/release/sqry 2>&1 | grep -q "statically linked" || \
            echo "::warning::Binary may not be fully statically linked"

      - name: Package binaries
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist staging-tar
          cp source/target/x86_64-unknown-linux-musl/release/sqry     dist/sqry-linux-x86_64
          cp source/target/x86_64-unknown-linux-musl/release/sqry-mcp dist/sqry-mcp-linux-x86_64
          cp source/target/x86_64-unknown-linux-musl/release/sqry-lsp dist/sqry-lsp-linux-x86_64
          chmod 755 dist/*

          # Create tarball for distribution
          mkdir -p "staging-tar/sqry-${VERSION}-linux-x86_64"
          cp dist/sqry-linux-x86_64     "staging-tar/sqry-${VERSION}-linux-x86_64/sqry"
          cp dist/sqry-mcp-linux-x86_64 "staging-tar/sqry-${VERSION}-linux-x86_64/sqry-mcp"
          cp dist/sqry-lsp-linux-x86_64 "staging-tar/sqry-${VERSION}-linux-x86_64/sqry-lsp"
          tar czf "dist/sqry-${VERSION}-linux-x86_64.tar.gz" -C staging-tar "sqry-${VERSION}-linux-x86_64"
          rm -rf staging-tar

          echo "Packaged binaries:"
          ls -lh dist/

      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign with Cosign (keyless OIDC)
        working-directory: dist
        run: |
          echo "Signing all Linux x86_64 artifacts with Cosign (keyless OIDC)..."
          for artifact in sqry-linux-x86_64 sqry-mcp-linux-x86_64 sqry-lsp-linux-x86_64 sqry-*-linux-x86_64.tar.gz; do
            [ -f "$artifact" ] || continue
            echo "  Signing ${artifact}..."
            cosign sign-blob --yes \
              --bundle "${artifact}.bundle" \
              "${artifact}"
            echo "  Signed: ${artifact}.bundle"
          done
          echo "All Linux x86_64 artifacts signed"

      - name: Generate checksums and SLSA subjects
        id: hash
        working-directory: dist
        run: |
          ASSETS=(sqry-linux-x86_64 sqry-mcp-linux-x86_64 sqry-lsp-linux-x86_64)
          for f in sqry-*-linux-x86_64.tar.gz; do [ -f "$f" ] && ASSETS+=("$f"); done
          sha256sum "${ASSETS[@]}" > CHECKSUMS-linux-x86_64.sha256
          echo "Checksums for Linux x86_64:"
          cat CHECKSUMS-linux-x86_64.sha256

          subjects=""
          for binary in "${ASSETS[@]}"; do
            digest=$(sha256sum "$binary" | awk '{print $1}')
            subject_json=$(jq -n --arg name "$binary" --arg hash "$digest" \
              '{name: $name, digest: {sha256: $hash}}')
            subject=$(printf '%s' "$subject_json" | base64 | tr -d '\n')
            subjects="${subjects}${subject}"$'\n'
            echo "SLSA subject: $binary (sha256: ${digest:0:16}...)"
          done
          subjects="${subjects%$'\n'}"
          DELIM="EOF_${RANDOM}_${RANDOM}"
          echo "subjects<<${DELIM}" >> "$GITHUB_OUTPUT"
          echo "$subjects" >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-linux-x86_64
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # Job 1b: Build + Sign — Linux ARM64 (musl, static, jemalloc)
  # ===========================================================================
  build-linux-arm64:
    name: Build + Sign — Linux ARM64
    needs: smoke-tests
    runs-on: ubuntu-22.04-arm
    environment: oss-signing
    permissions:
      contents: read
      id-token: write
    outputs:
      subjects: ${{ steps.hash.outputs.subjects }}

    steps:
      - name: Validate version and enforce tag ref
        env:
          VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format: '$VERSION'"
            exit 1
          fi
          if [ "$REF_TYPE" != "tag" ] || [ "$REF_NAME" != "$VERSION" ]; then
            echo "::error::Must be dispatched from tag ref '$VERSION'"
            exit 1
          fi

      - name: Checkout public repo at tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 1
          path: source

      - name: Verify tag checkout
        working-directory: source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! git describe --tags --exact-match 2>/dev/null | grep -qE "^${VERSION}$"; then
            echo "::error::Checkout does not match tag '$VERSION'"
            exit 1
          fi
          echo "Tag '$VERSION' verified at $(git rev-parse --short HEAD)"

      - name: Install musl toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          musl-gcc --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.90"
          targets: aarch64-unknown-linux-musl

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: source
          key: aarch64-unknown-linux-musl

      - name: Build release binaries (musl static)
        working-directory: source
        env:
          CARGO_BUILD_JOBS: "2"
          RUSTFLAGS: "-Csplit-debuginfo=unpacked -Ctarget-feature=+crt-static"
          JEMALLOC_SYS_WITH_LG_PAGE: "16"
        run: |
          cargo build --release \
            --target aarch64-unknown-linux-musl \
            -p sqry-cli \
            -p sqry-mcp \
            -p sqry-lsp
          echo "Release binaries built successfully"
          ls -lh target/aarch64-unknown-linux-musl/release/sqry \
                  target/aarch64-unknown-linux-musl/release/sqry-mcp \
                  target/aarch64-unknown-linux-musl/release/sqry-lsp

      - name: Package binaries
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist staging-tar
          cp source/target/aarch64-unknown-linux-musl/release/sqry     dist/sqry-linux-arm64
          cp source/target/aarch64-unknown-linux-musl/release/sqry-mcp dist/sqry-mcp-linux-arm64
          cp source/target/aarch64-unknown-linux-musl/release/sqry-lsp dist/sqry-lsp-linux-arm64
          chmod 755 dist/*

          # Create tarball for distribution
          mkdir -p "staging-tar/sqry-${VERSION}-linux-arm64"
          cp dist/sqry-linux-arm64     "staging-tar/sqry-${VERSION}-linux-arm64/sqry"
          cp dist/sqry-mcp-linux-arm64 "staging-tar/sqry-${VERSION}-linux-arm64/sqry-mcp"
          cp dist/sqry-lsp-linux-arm64 "staging-tar/sqry-${VERSION}-linux-arm64/sqry-lsp"
          tar czf "dist/sqry-${VERSION}-linux-arm64.tar.gz" -C staging-tar "sqry-${VERSION}-linux-arm64"
          rm -rf staging-tar

          echo "Packaged binaries:"
          ls -lh dist/

      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign with Cosign (keyless OIDC)
        working-directory: dist
        run: |
          echo "Signing all Linux ARM64 artifacts with Cosign (keyless OIDC)..."
          for artifact in sqry-linux-arm64 sqry-mcp-linux-arm64 sqry-lsp-linux-arm64 sqry-*-linux-arm64.tar.gz; do
            [ -f "$artifact" ] || continue
            echo "  Signing ${artifact}..."
            cosign sign-blob --yes \
              --bundle "${artifact}.bundle" \
              "${artifact}"
            echo "  Signed: ${artifact}.bundle"
          done
          echo "All Linux ARM64 artifacts signed"

      - name: Generate checksums and SLSA subjects
        id: hash
        working-directory: dist
        run: |
          ASSETS=(sqry-linux-arm64 sqry-mcp-linux-arm64 sqry-lsp-linux-arm64)
          for f in sqry-*-linux-arm64.tar.gz; do [ -f "$f" ] && ASSETS+=("$f"); done
          sha256sum "${ASSETS[@]}" > CHECKSUMS-linux-arm64.sha256
          echo "Checksums for Linux ARM64:"
          cat CHECKSUMS-linux-arm64.sha256

          subjects=""
          for binary in "${ASSETS[@]}"; do
            digest=$(sha256sum "$binary" | awk '{print $1}')
            subject_json=$(jq -n --arg name "$binary" --arg hash "$digest" \
              '{name: $name, digest: {sha256: $hash}}')
            subject=$(printf '%s' "$subject_json" | base64 | tr -d '\n')
            subjects="${subjects}${subject}"$'\n'
            echo "SLSA subject: $binary (sha256: ${digest:0:16}...)"
          done
          subjects="${subjects%$'\n'}"
          DELIM="EOF_${RANDOM}_${RANDOM}"
          echo "subjects<<${DELIM}" >> "$GITHUB_OUTPUT"
          echo "$subjects" >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-linux-arm64
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # Job 1c: Build + Sign — Windows x86_64 (MSVC)
  # Cosign always; SignPath Authenticode conditional on secrets.SIGNPATH_API_TOKEN
  # ===========================================================================
  build-windows-x86_64:
    name: Build + Sign — Windows x86_64
    needs: smoke-tests
    runs-on: windows-2022
    environment: oss-signing
    permissions:
      contents: read
      id-token: write
    outputs:
      subjects: ${{ steps.hash.outputs.subjects }}

    steps:
      - name: Validate version and enforce tag ref
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format: '$VERSION'"
            exit 1
          fi
          if [ "$REF_TYPE" != "tag" ] || [ "$REF_NAME" != "$VERSION" ]; then
            echo "::error::Must be dispatched from tag ref '$VERSION'"
            exit 1
          fi

      - name: Checkout public repo at tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 1
          path: source

      - name: Verify tag checkout
        working-directory: source
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! git describe --tags --exact-match 2>/dev/null | grep -qE "^${VERSION}$"; then
            echo "::error::Checkout does not match tag '$VERSION'"
            exit 1
          fi
          echo "Tag '$VERSION' verified at $(git rev-parse --short HEAD)"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.90"
          targets: x86_64-pc-windows-msvc

      - name: Configure cargo git CLI
        shell: bash
        run: |
          mkdir -p ~/.cargo
          echo '[net]' >> ~/.cargo/config.toml
          echo 'git-fetch-with-cli = true' >> ~/.cargo/config.toml

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: source
          key: x86_64-pc-windows-msvc

      - name: Build release binaries
        working-directory: source
        shell: bash
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          cargo build --release \
            --target x86_64-pc-windows-msvc \
            -p sqry-cli \
            -p sqry-mcp \
            -p sqry-lsp
          echo "Release binaries built successfully"

      - name: Package binaries
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          cp source/target/x86_64-pc-windows-msvc/release/sqry.exe     dist/sqry-windows-x86_64.exe
          cp source/target/x86_64-pc-windows-msvc/release/sqry-mcp.exe dist/sqry-mcp-windows-x86_64.exe
          cp source/target/x86_64-pc-windows-msvc/release/sqry-lsp.exe dist/sqry-lsp-windows-x86_64.exe

          # Create zip bundle
          mkdir -p dist/windows-bundle
          cp dist/sqry-windows-x86_64.exe     dist/windows-bundle/sqry.exe
          cp dist/sqry-mcp-windows-x86_64.exe dist/windows-bundle/sqry-mcp.exe
          cp dist/sqry-lsp-windows-x86_64.exe dist/windows-bundle/sqry-lsp.exe
          cat > dist/windows-bundle/README-WINDOWS.txt <<'WEOF'
          sqry Windows bundle

          Included binaries:
          - sqry.exe
          - sqry-mcp.exe
          - sqry-lsp.exe

          Typical next steps:
          1. Copy the three .exe files into a directory on PATH.
          2. Or run scripts/install.ps1 from the repository for a guided install.
          3. Then verify:
             sqry --version
             sqry-mcp --version
             sqry-lsp --version
          WEOF

      - name: Create zip archive
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          Compress-Archive -Path 'dist/windows-bundle/*' -DestinationPath "dist/sqry-$env:VERSION-windows-x86_64.zip" -Force

      - name: Cleanup bundle directory
        shell: bash
        run: rm -rf dist/windows-bundle

      # --- Conditional SignPath Authenticode signing ---
      - name: SignPath Authenticode sign (conditional)
        if: inputs.enable_signpath
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
        run: |
          if ([string]::IsNullOrEmpty($env:SIGNPATH_API_TOKEN)) {
            Write-Host "::warning::SignPath enabled but SIGNPATH_API_TOKEN secret is not set -- skipping"
            exit 0
          }
          Write-Host "::add-mask::$env:SIGNPATH_API_TOKEN"

          $exeFiles = @(
            "dist\sqry-windows-x86_64.exe",
            "dist\sqry-mcp-windows-x86_64.exe",
            "dist\sqry-lsp-windows-x86_64.exe"
          )
          foreach ($file in $exeFiles) {
            Write-Host "Submitting $file to SignPath..."
            # SignPath submit-signing-request would go here.
            # The actual SignPath CLI invocation depends on the configured project.
            Write-Host "::notice::SignPath signing for $file -- integration pending org setup"
          }

      - name: Verify Authenticode signatures (conditional)
        if: inputs.enable_signpath
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:SIGNPATH_API_TOKEN)) {
            Write-Host "::warning::SignPath token not set -- skipping Authenticode verification"
            exit 0
          }
          $files = @(
            "dist\sqry-windows-x86_64.exe",
            "dist\sqry-mcp-windows-x86_64.exe",
            "dist\sqry-lsp-windows-x86_64.exe"
          )
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file
            if ($signature.Status -ne 'Valid') {
              throw "Authenticode verification failed for $file with status '$($signature.Status)'"
            }
            Write-Host "Valid Authenticode signature: $file"
          }

      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign with Cosign (keyless OIDC)
        working-directory: dist
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "Signing all Windows x86_64 artifacts with Cosign (keyless OIDC)..."
          WINDOWS_ASSETS=(
            sqry-windows-x86_64.exe
            sqry-mcp-windows-x86_64.exe
            sqry-lsp-windows-x86_64.exe
            "sqry-${VERSION}-windows-x86_64.zip"
          )
          for artifact in "${WINDOWS_ASSETS[@]}"; do
            [ -f "$artifact" ] || continue
            echo "  Signing ${artifact}..."
            cosign sign-blob --yes \
              --bundle "${artifact}.bundle" \
              "${artifact}"
            echo "  Signed: ${artifact}.bundle"
          done
          echo "All Windows x86_64 artifacts signed"

      - name: Generate checksums and SLSA subjects
        id: hash
        working-directory: dist
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          WINDOWS_ASSETS=(
            sqry-windows-x86_64.exe
            sqry-mcp-windows-x86_64.exe
            sqry-lsp-windows-x86_64.exe
            "sqry-${VERSION}-windows-x86_64.zip"
          )
          sha256sum "${WINDOWS_ASSETS[@]}" > CHECKSUMS-windows-x86_64.sha256
          echo "Checksums for Windows x86_64:"
          cat CHECKSUMS-windows-x86_64.sha256

          subjects=""
          for binary in "${WINDOWS_ASSETS[@]}"; do
            digest=$(sha256sum "$binary" | awk '{print $1}')
            subject_json=$(jq -n --arg name "$binary" --arg hash "$digest" \
              '{name: $name, digest: {sha256: $hash}}')
            subject=$(printf '%s' "$subject_json" | base64 | tr -d '\n')
            subjects="${subjects}${subject}"$'\n'
            echo "SLSA subject: $binary (sha256: ${digest:0:16}...)"
          done
          subjects="${subjects%$'\n'}"
          DELIM="EOF_${RANDOM}_${RANDOM}"
          echo "subjects<<${DELIM}" >> "$GITHUB_OUTPUT"
          echo "$subjects" >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-windows-x86_64
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # Job 1d: Build + Sign — macOS ARM64 (Apple Silicon)
  # Full Apple pipeline: codesign -> pkgbuild -> productsign -> notarize -> staple
  # Plus Cosign OIDC on all outputs.
  # ===========================================================================
  build-macos-arm64:
    name: Build + Sign — macOS ARM64
    needs: smoke-tests
    runs-on: macos-14
    environment: oss-signing
    permissions:
      contents: read
      id-token: write
    outputs:
      subjects: ${{ steps.hash.outputs.subjects }}

    steps:
      - name: Validate version and enforce tag ref
        env:
          VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format: '$VERSION'"
            exit 1
          fi
          if [ "$REF_TYPE" != "tag" ] || [ "$REF_NAME" != "$VERSION" ]; then
            echo "::error::Must be dispatched from tag ref '$VERSION'"
            exit 1
          fi

      - name: Free disk space
        run: |
          sudo rm -rf ~/Library/Caches/Homebrew || true
          sudo rm -rf /opt/hostedtoolcache/go || true
          sudo rm -rf /opt/hostedtoolcache/Python || true
          sudo rm -rf /opt/hostedtoolcache/Ruby || true
          df -h /

      - name: Checkout public repo at tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 1
          path: source

      - name: Verify tag checkout
        working-directory: source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! git describe --tags --exact-match 2>/dev/null | grep -qE "^${VERSION}$"; then
            echo "::error::Checkout does not match tag '$VERSION'"
            exit 1
          fi
          echo "Tag '$VERSION' verified at $(git rev-parse --short HEAD)"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.90"
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: source
          key: aarch64-apple-darwin

      - name: Build release binaries
        working-directory: source
        env:
          CARGO_BUILD_JOBS: "2"
          RUSTFLAGS: "-Csplit-debuginfo=unpacked"
        run: |
          cargo build --release \
            --target aarch64-apple-darwin \
            -p sqry-cli \
            -p sqry-mcp \
            -p sqry-lsp
          echo "Release binaries built successfully"
          ls -lh target/aarch64-apple-darwin/release/sqry \
                  target/aarch64-apple-darwin/release/sqry-mcp \
                  target/aarch64-apple-darwin/release/sqry-lsp

      - name: Package binaries
        run: |
          mkdir -p dist
          cp source/target/aarch64-apple-darwin/release/sqry     dist/sqry-macos-arm64
          cp source/target/aarch64-apple-darwin/release/sqry-mcp dist/sqry-mcp-macos-arm64
          cp source/target/aarch64-apple-darwin/release/sqry-lsp dist/sqry-lsp-macos-arm64
          chmod 755 dist/*
          ls -lh dist/

      # -----------------------------------------------------------------
      # Apple Developer ID code signing + pkgbuild + notarization (opt-in)
      # -----------------------------------------------------------------
      - name: Azure OIDC login for Apple signing secrets
        if: inputs.enable_apple_signing
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Retrieve Apple signing credentials from Key Vault
        if: inputs.enable_apple_signing
        run: |
          APPLE_TEAM_ID=$(az keyvault secret show --vault-name verivus-dev-secrets-kv --name apple-team-id --query value -o tsv)
          APPLE_DEV_EMAIL=$(az keyvault secret show --vault-name verivus-dev-secrets-kv --name apple-developer-email --query value -o tsv)
          APPLE_NOTARIZE_PW=$(az keyvault secret show --vault-name verivus-dev-secrets-kv --name apple-notarize-password --query value -o tsv)
          APPLE_APP_CERT_B64=$(az keyvault secret show --vault-name verivus-dev-secrets-kv --name apple-devid-application-cert --query value -o tsv)
          APPLE_APP_KEY_B64=$(az keyvault secret show --vault-name verivus-dev-secrets-kv --name apple-devid-application-key --query value -o tsv)
          APPLE_INST_CERT_B64=$(az keyvault secret show --vault-name verivus-dev-secrets-kv --name apple-devid-installer-cert --query value -o tsv)
          APPLE_INST_KEY_B64=$(az keyvault secret show --vault-name verivus-dev-secrets-kv --name apple-devid-installer-key --query value -o tsv)

          echo "::add-mask::$APPLE_NOTARIZE_PW"
          echo "::add-mask::$APPLE_APP_CERT_B64"
          echo "::add-mask::$APPLE_APP_KEY_B64"
          echo "::add-mask::$APPLE_INST_CERT_B64"
          echo "::add-mask::$APPLE_INST_KEY_B64"

          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          echo "APPLE_DEV_EMAIL=$APPLE_DEV_EMAIL" >> "$GITHUB_ENV"
          echo "APPLE_NOTARIZE_PW=$APPLE_NOTARIZE_PW" >> "$GITHUB_ENV"
          echo "APPLE_APP_CERT_B64=$APPLE_APP_CERT_B64" >> "$GITHUB_ENV"
          echo "APPLE_APP_KEY_B64=$APPLE_APP_KEY_B64" >> "$GITHUB_ENV"
          echo "APPLE_INST_CERT_B64=$APPLE_INST_CERT_B64" >> "$GITHUB_ENV"
          echo "APPLE_INST_KEY_B64=$APPLE_INST_KEY_B64" >> "$GITHUB_ENV"
          echo "Apple signing credentials retrieved"

      - name: Import Apple certificates into temporary keychain
        if: inputs.enable_apple_signing
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/apple-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -hex 24)"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 900 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"

          # Import Developer ID Application certificate + key (for codesign)
          echo "$APPLE_APP_CERT_B64" | base64 --decode > "$RUNNER_TEMP/devid-app.cer"
          security import "$RUNNER_TEMP/devid-app.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          echo "$APPLE_APP_KEY_B64" | base64 --decode > "$RUNNER_TEMP/devid-app.key"
          security import "$RUNNER_TEMP/devid-app.key" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign

          # Import Developer ID Installer certificate + key (for productsign)
          echo "$APPLE_INST_CERT_B64" | base64 --decode > "$RUNNER_TEMP/devid-inst.cer"
          security import "$RUNNER_TEMP/devid-inst.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/productsign
          echo "$APPLE_INST_KEY_B64" | base64 --decode > "$RUNNER_TEMP/devid-inst.key"
          security import "$RUNNER_TEMP/devid-inst.key" -k "$KEYCHAIN_PATH" -T /usr/bin/productsign

          # Allow codesign and productsign to access keychain without GUI prompt
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "APPLE_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          rm -f "$RUNNER_TEMP/devid-app.cer" "$RUNNER_TEMP/devid-app.key"
          rm -f "$RUNNER_TEMP/devid-inst.cer" "$RUNNER_TEMP/devid-inst.key"
          echo "Apple certificates imported into temporary keychain"

      - name: Apple codesign macOS binaries
        if: inputs.enable_apple_signing
        working-directory: dist
        env:
          TEAM_ID: ${{ env.APPLE_TEAM_ID }}
        run: |
          IDENTITY="Developer ID Application: Verivus Pty Ltd ($TEAM_ID)"
          echo "Signing with identity: $IDENTITY"

          for binary in sqry-macos-arm64 sqry-mcp-macos-arm64 sqry-lsp-macos-arm64; do
            echo "  Signing $binary..."
            codesign --sign "$IDENTITY" \
              --options runtime \
              --timestamp \
              --force \
              "$binary"
            codesign --verify --deep --strict "$binary"
            echo "  Verified: $binary"
          done
          echo "All macOS binaries code-signed"

      - name: Build .pkg installer (pkgbuild + productsign)
        if: inputs.enable_apple_signing
        env:
          VERSION: ${{ inputs.version }}
          TEAM_ID: ${{ env.APPLE_TEAM_ID }}
        run: |
          VERSION_NO_V="${VERSION#v}"

          # Create payload structure for pkgbuild
          PKG_ROOT="$RUNNER_TEMP/pkg-root"
          mkdir -p "$PKG_ROOT/usr/local/bin"
          cp dist/sqry-macos-arm64     "$PKG_ROOT/usr/local/bin/sqry"
          cp dist/sqry-mcp-macos-arm64 "$PKG_ROOT/usr/local/bin/sqry-mcp"
          cp dist/sqry-lsp-macos-arm64 "$PKG_ROOT/usr/local/bin/sqry-lsp"

          # Build unsigned component package
          UNSIGNED_PKG="$RUNNER_TEMP/sqry-unsigned.pkg"
          pkgbuild \
            --root "$PKG_ROOT" \
            --identifier "dev.sqry.cli" \
            --version "$VERSION_NO_V" \
            --install-location "/" \
            "$UNSIGNED_PKG"

          # Sign the package with Developer ID Installer
          INSTALLER_IDENTITY="Developer ID Installer: Verivus Pty Ltd ($TEAM_ID)"
          productsign \
            --sign "$INSTALLER_IDENTITY" \
            --timestamp \
            "$UNSIGNED_PKG" \
            "dist/sqry-${VERSION}-macos-arm64.pkg"

          rm -f "$UNSIGNED_PKG"
          rm -rf "$PKG_ROOT"
          echo "Signed .pkg created:"
          ls -lh "dist/sqry-${VERSION}-macos-arm64.pkg"

      - name: Notarize macOS binaries and .pkg
        if: inputs.enable_apple_signing
        working-directory: dist
        env:
          DEV_EMAIL: ${{ env.APPLE_DEV_EMAIL }}
          TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          NOTARIZE_PW: ${{ env.APPLE_NOTARIZE_PW }}
          VERSION: ${{ inputs.version }}
        run: |
          # Notarize individual binaries
          for binary in sqry-macos-arm64 sqry-mcp-macos-arm64 sqry-lsp-macos-arm64; do
            echo "  Notarizing $binary..."
            zip "${binary}.zip" "$binary"
            xcrun notarytool submit "${binary}.zip" \
              --apple-id "$DEV_EMAIL" \
              --team-id "$TEAM_ID" \
              --password "$NOTARIZE_PW" \
              --wait --timeout 10m
            rm "${binary}.zip"
            echo "  Notarized: $binary"
          done

          # Notarize the .pkg
          PKG_FILE="sqry-${VERSION}-macos-arm64.pkg"
          if [ -f "$PKG_FILE" ]; then
            echo "  Notarizing $PKG_FILE..."
            xcrun notarytool submit "$PKG_FILE" \
              --apple-id "$DEV_EMAIL" \
              --team-id "$TEAM_ID" \
              --password "$NOTARIZE_PW" \
              --wait --timeout 10m
            # Staple the notarization ticket to the .pkg
            xcrun stapler staple "$PKG_FILE"
            echo "  Notarized and stapled: $PKG_FILE"
          fi
          echo "All macOS artifacts notarized"

      - name: Cleanup Apple keychain
        if: always() && inputs.enable_apple_signing
        run: |
          if [ -n "${APPLE_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$APPLE_KEYCHAIN_PATH" 2>/dev/null || true
          fi

      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign with Cosign (keyless OIDC)
        working-directory: dist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "Signing all macOS ARM64 artifacts with Cosign (keyless OIDC)..."
          MACOS_ASSETS=(sqry-macos-arm64 sqry-mcp-macos-arm64 sqry-lsp-macos-arm64)
          # Include .pkg if Apple signing produced it
          PKG_FILE="sqry-${VERSION}-macos-arm64.pkg"
          [ -f "$PKG_FILE" ] && MACOS_ASSETS+=("$PKG_FILE")
          for artifact in "${MACOS_ASSETS[@]}"; do
            echo "  Signing ${artifact}..."
            cosign sign-blob --yes \
              --bundle "${artifact}.bundle" \
              "${artifact}"
            echo "  Signed: ${artifact}.bundle"
          done
          echo "All macOS ARM64 artifacts signed"

      # NOTE: Use portable tr -d '\n' to strip line breaks from base64 output,
      # since BSD base64 (macOS) wraps at 76 chars by default and -w0 is GNU-only.
      - name: Generate checksums and SLSA subjects
        id: hash
        working-directory: dist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          MACOS_ASSETS=(sqry-macos-arm64 sqry-mcp-macos-arm64 sqry-lsp-macos-arm64)
          PKG_FILE="sqry-${VERSION}-macos-arm64.pkg"
          [ -f "$PKG_FILE" ] && MACOS_ASSETS+=("$PKG_FILE")
          shasum -a 256 "${MACOS_ASSETS[@]}" > CHECKSUMS-macos-arm64.sha256
          echo "Checksums for macOS ARM64:"
          cat CHECKSUMS-macos-arm64.sha256

          subjects=""
          for binary in "${MACOS_ASSETS[@]}"; do
            digest=$(shasum -a 256 "$binary" | awk '{print $1}')
            subject_json=$(jq -n --arg name "$binary" --arg hash "$digest" \
              '{name: $name, digest: {sha256: $hash}}')
            subject=$(printf '%s' "$subject_json" | base64 | tr -d '\n')
            subjects="${subjects}${subject}"$'\n'
            echo "SLSA subject: $binary (sha256: ${digest:0:16}...)"
          done
          subjects="${subjects%$'\n'}"
          DELIM="EOF_${RANDOM}_${RANDOM}"
          echo "subjects<<${DELIM}" >> "$GITHUB_OUTPUT"
          echo "$subjects" >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-macos-arm64
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # Job 1e: Build + Sign — VSCode Extension (.vsix)
  # Cosign OIDC only.
  # ===========================================================================
  build-vscode-extension:
    name: Build + Sign — VSCode Extension
    needs: smoke-tests
    runs-on: ubuntu-24.04
    environment: oss-signing
    permissions:
      contents: read
      id-token: write
    outputs:
      subjects: ${{ steps.hash.outputs.subjects }}

    steps:
      - name: Validate version and enforce tag ref
        env:
          VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format: '$VERSION'"
            exit 1
          fi
          if [ "$REF_TYPE" != "tag" ] || [ "$REF_NAME" != "$VERSION" ]; then
            echo "::error::Must be dispatched from tag ref '$VERSION'"
            exit 1
          fi

      - name: Checkout public repo at tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 1
          path: source

      - name: Verify tag checkout
        working-directory: source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! git describe --tags --exact-match 2>/dev/null | grep -qE "^${VERSION}$"; then
            echo "::error::Checkout does not match tag '$VERSION'"
            exit 1
          fi
          echo "Tag '$VERSION' verified at $(git rev-parse --short HEAD)"

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Package VSCode extension
        env:
          VERSION: ${{ inputs.version }}
          WORKSPACE_DIR: ${{ github.workspace }}
        run: |
          mkdir -p "$WORKSPACE_DIR/dist"
          cd source/tools/sqry-vscode
          npm ci
          npx --yes @vscode/vsce@3.3.0 package \
            --out "$WORKSPACE_DIR/dist/sqry-vscode-${VERSION}.vsix"
          echo "VSCode extension packaged:"
          ls -lh "$WORKSPACE_DIR/dist/"

      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign with Cosign (keyless OIDC)
        working-directory: dist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VSIX_FILE="sqry-vscode-${VERSION}.vsix"
          echo "Signing ${VSIX_FILE} with Cosign (keyless OIDC)..."
          cosign sign-blob --yes \
            --bundle "${VSIX_FILE}.bundle" \
            "${VSIX_FILE}"
          echo "Signed: ${VSIX_FILE}.bundle"

      - name: Generate checksums and SLSA subjects
        id: hash
        working-directory: dist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VSIX_FILE="sqry-vscode-${VERSION}.vsix"
          sha256sum "${VSIX_FILE}" > CHECKSUMS-vscode.sha256
          echo "Checksums for VSCode extension:"
          cat CHECKSUMS-vscode.sha256

          digest=$(sha256sum "${VSIX_FILE}" | awk '{print $1}')
          subject_json=$(jq -n --arg name "${VSIX_FILE}" --arg hash "$digest" \
            '{name: $name, digest: {sha256: $hash}}')
          subject=$(printf '%s' "$subject_json" | base64 | tr -d '\n')
          echo "SLSA subject: ${VSIX_FILE} (sha256: ${digest:0:16}...)"

          DELIM="EOF_${RANDOM}_${RANDOM}"
          echo "subjects<<${DELIM}" >> "$GITHUB_OUTPUT"
          echo "$subject" >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-vscode
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # Job 2a: Package — Windows MSI (WiX)
  # Conditional SignPath for Authenticode on the .msi itself.
  # ===========================================================================
  package-windows-msi:
    name: Package — Windows MSI
    needs: build-windows-x86_64
    runs-on: windows-2022
    environment: oss-signing
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download signed Windows binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-windows-x86_64
          path: signed-windows

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix --version

      - name: Build MSI with WiX
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $versionNoV = $env:VERSION.TrimStart('v')

          # Create WiX source directory
          $wxsDir = "wix-build"
          New-Item -ItemType Directory -Path $wxsDir -Force | Out-Null

          # Create WiX v5 source file
          $wxsContent = @"
          <Wix xmlns="http://wixtoolset.org/schemas/v4/wxs">
            <Package Name="sqry" Version="$versionNoV" Manufacturer="Verivus Pty Ltd"
                     UpgradeCode="6E8A9F3B-2D4C-4E5F-8A1B-3C7D9E0F2B4A"
                     Scope="perMachine">
              <MajorUpgrade DowngradeErrorMessage="A newer version of sqry is already installed." />
              <MediaTemplate EmbedCab="yes" />
              <Feature Id="Complete" Title="sqry" Level="1">
                <ComponentGroupRef Id="BinaryComponents" />
              </Feature>
              <StandardDirectory Id="ProgramFiles64Folder">
                <Directory Id="INSTALLFOLDER" Name="sqry">
                  <Component Id="sqry_exe" Guid="*">
                    <File Source="`$(var.BinDir)\sqry-windows-x86_64.exe" Name="sqry.exe" KeyPath="yes" />
                  </Component>
                  <Component Id="sqry_mcp_exe" Guid="*">
                    <File Source="`$(var.BinDir)\sqry-mcp-windows-x86_64.exe" Name="sqry-mcp.exe" KeyPath="yes" />
                  </Component>
                  <Component Id="sqry_lsp_exe" Guid="*">
                    <File Source="`$(var.BinDir)\sqry-lsp-windows-x86_64.exe" Name="sqry-lsp.exe" KeyPath="yes" />
                  </Component>
                  <Component Id="PathEntry" Guid="A1B2C3D4-E5F6-7890-ABCD-EF1234567890">
                    <CreateFolder />
                    <Environment Id="PATH" Name="PATH" Value="[INSTALLFOLDER]" Permanent="no" Part="last" Action="set" System="yes" />
                  </Component>
                </Directory>
              </StandardDirectory>
              <ComponentGroup Id="BinaryComponents">
                <ComponentRef Id="sqry_exe" />
                <ComponentRef Id="sqry_mcp_exe" />
                <ComponentRef Id="sqry_lsp_exe" />
                <ComponentRef Id="PathEntry" />
              </ComponentGroup>
            </Package>
          </Wix>
          "@
          $wxsContent | Out-File -FilePath "$wxsDir\sqry.wxs" -Encoding utf8

          $binDir = (Resolve-Path "signed-windows").Path

          wix build "$wxsDir\sqry.wxs" `
            -d "BinDir=$binDir" `
            -o "signed-windows\sqry-$env:VERSION-windows-x86_64.msi" `
            -arch x64

          Write-Host "MSI built:"
          Get-ChildItem "signed-windows\sqry-$env:VERSION-windows-x86_64.msi"

      - name: SignPath Authenticode sign MSI (conditional)
        if: inputs.enable_signpath
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if ([string]::IsNullOrEmpty($env:SIGNPATH_API_TOKEN)) {
            Write-Host "::warning::SignPath enabled but SIGNPATH_API_TOKEN secret is not set -- skipping"
            exit 0
          }
          Write-Host "::add-mask::$env:SIGNPATH_API_TOKEN"
          $msiFile = "signed-windows\sqry-$env:VERSION-windows-x86_64.msi"
          Write-Host "::notice::SignPath signing for $msiFile -- integration pending org setup"

      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign MSI with Cosign (keyless OIDC)
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          MSI_FILE="signed-windows/sqry-${VERSION}-windows-x86_64.msi"
          echo "Signing MSI with Cosign (keyless OIDC)..."
          cosign sign-blob --yes \
            --bundle "${MSI_FILE}.bundle" \
            "${MSI_FILE}"
          echo "Signed: ${MSI_FILE}.bundle"

      - name: Generate MSI checksum
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          MSI_FILE="sqry-${VERSION}-windows-x86_64.msi"
          cd signed-windows
          sha256sum "$MSI_FILE" > "CHECKSUMS-windows-msi.sha256"
          echo "MSI checksum:"
          cat CHECKSUMS-windows-msi.sha256

      - name: Upload MSI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-windows-msi
          path: |
            signed-windows/sqry-*-windows-x86_64.msi
            signed-windows/sqry-*-windows-x86_64.msi.bundle
            signed-windows/CHECKSUMS-windows-msi.sha256
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # Job 2b: Package — Linux .deb
  # ===========================================================================
  package-linux-deb:
    name: Package — Linux .deb
    needs: build-linux-x86_64
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download signed Linux x86_64 binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-linux-x86_64
          path: signed-linux

      - name: Build .deb package
        env:
          VERSION: ${{ inputs.version }}
          TEMP_DIR: ${{ runner.temp }}
        run: |
          VERSION_NO_V="${VERSION#v}"

          # Create Debian package structure
          PKG_DIR="${TEMP_DIR}/sqry-deb"
          mkdir -p "$PKG_DIR/DEBIAN"
          mkdir -p "$PKG_DIR/usr/bin"

          cp signed-linux/sqry-linux-x86_64     "$PKG_DIR/usr/bin/sqry"
          cp signed-linux/sqry-mcp-linux-x86_64 "$PKG_DIR/usr/bin/sqry-mcp"
          cp signed-linux/sqry-lsp-linux-x86_64 "$PKG_DIR/usr/bin/sqry-lsp"
          chmod 755 "$PKG_DIR/usr/bin/"*

          cat > "$PKG_DIR/DEBIAN/control" <<DEBEOF
          Package: sqry
          Version: ${VERSION_NO_V}
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: Verivus Pty Ltd <hello@sqry.dev>
          Homepage: https://sqry.dev
          Description: Semantic code search tool
           sqry is a lean, focused semantic code search tool that understands code
           structure through AST analysis. Includes sqry CLI, sqry-mcp (MCP server),
           and sqry-lsp (Language Server Protocol).
          DEBEOF

          dpkg-deb --build --root-owner-group "$PKG_DIR" "signed-linux/sqry-${VERSION}-linux-amd64.deb"
          rm -rf "$PKG_DIR"

          echo ".deb package built:"
          ls -lh "signed-linux/sqry-${VERSION}-linux-amd64.deb"

      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign .deb with Cosign
        env:
          VERSION: ${{ inputs.version }}
        run: |
          DEB_FILE="signed-linux/sqry-${VERSION}-linux-amd64.deb"
          cosign sign-blob --yes \
            --bundle "${DEB_FILE}.bundle" \
            "${DEB_FILE}"
          echo "Signed: ${DEB_FILE}.bundle"

      - name: Generate .deb checksum
        env:
          VERSION: ${{ inputs.version }}
        run: |
          DEB_FILE="sqry-${VERSION}-linux-amd64.deb"
          cd signed-linux
          sha256sum "$DEB_FILE" > CHECKSUMS-linux-deb.sha256
          echo ".deb checksum:"
          cat CHECKSUMS-linux-deb.sha256

      - name: Upload .deb artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-linux-deb
          path: |
            signed-linux/sqry-*-linux-amd64.deb
            signed-linux/sqry-*-linux-amd64.deb.bundle
            signed-linux/CHECKSUMS-linux-deb.sha256
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # Job 2c: Package — Linux .rpm
  # ===========================================================================
  package-linux-rpm:
    name: Package — Linux .rpm
    needs: build-linux-x86_64
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download signed Linux x86_64 binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-linux-x86_64
          path: signed-linux

      - name: Install RPM build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm

      - name: Build .rpm package
        env:
          VERSION: ${{ inputs.version }}
          TEMP_DIR: ${{ runner.temp }}
        run: |
          VERSION_NO_V="${VERSION#v}"

          # Create RPM build structure
          RPM_BUILD="${TEMP_DIR}/rpmbuild"
          mkdir -p "$RPM_BUILD"/{BUILD,RPMS,SOURCES,SPECS,SRPMS,BUILDROOT}

          # Create tarball source
          SOURCE_DIR="sqry-${VERSION_NO_V}"
          mkdir -p "${TEMP_DIR}/$SOURCE_DIR/usr/bin"
          cp signed-linux/sqry-linux-x86_64     "${TEMP_DIR}/$SOURCE_DIR/usr/bin/sqry"
          cp signed-linux/sqry-mcp-linux-x86_64 "${TEMP_DIR}/$SOURCE_DIR/usr/bin/sqry-mcp"
          cp signed-linux/sqry-lsp-linux-x86_64 "${TEMP_DIR}/$SOURCE_DIR/usr/bin/sqry-lsp"
          chmod 755 "${TEMP_DIR}/$SOURCE_DIR/usr/bin/"*
          tar czf "$RPM_BUILD/SOURCES/sqry-${VERSION_NO_V}.tar.gz" -C "${TEMP_DIR}" "$SOURCE_DIR"
          rm -rf "${TEMP_DIR}/$SOURCE_DIR"

          cat > "$RPM_BUILD/SPECS/sqry.spec" <<'RPMEOF'
          Name:           sqry
          Version:        %{_version}
          Release:        1%{?dist}
          Summary:        Semantic code search tool
          License:        MIT
          URL:            https://sqry.dev
          Source0:        sqry-%{_version}.tar.gz

          %description
          sqry is a lean, focused semantic code search tool that understands code
          structure through AST analysis. Includes sqry CLI, sqry-mcp (MCP server),
          and sqry-lsp (Language Server Protocol).

          %prep
          %setup -q -n sqry-%{_version}

          %install
          mkdir -p %{buildroot}/usr/bin
          cp usr/bin/sqry     %{buildroot}/usr/bin/sqry
          cp usr/bin/sqry-mcp %{buildroot}/usr/bin/sqry-mcp
          cp usr/bin/sqry-lsp %{buildroot}/usr/bin/sqry-lsp

          %files
          %attr(755,root,root) /usr/bin/sqry
          %attr(755,root,root) /usr/bin/sqry-mcp
          %attr(755,root,root) /usr/bin/sqry-lsp
          RPMEOF

          rpmbuild -bb \
            --define "_topdir $RPM_BUILD" \
            --define "_version $VERSION_NO_V" \
            "$RPM_BUILD/SPECS/sqry.spec"

          # Find and copy the built RPM
          RPM_FILE=$(find "$RPM_BUILD/RPMS" -name "sqry-*.rpm" | head -1)
          if [ -z "$RPM_FILE" ]; then
            echo "::error::RPM build did not produce output"
            exit 1
          fi
          cp "$RPM_FILE" "signed-linux/sqry-${VERSION}-linux-x86_64.rpm"
          rm -rf "$RPM_BUILD"

          echo ".rpm package built:"
          ls -lh "signed-linux/sqry-${VERSION}-linux-x86_64.rpm"

      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign .rpm with Cosign
        env:
          VERSION: ${{ inputs.version }}
        run: |
          RPM_FILE="signed-linux/sqry-${VERSION}-linux-x86_64.rpm"
          cosign sign-blob --yes \
            --bundle "${RPM_FILE}.bundle" \
            "${RPM_FILE}"
          echo "Signed: ${RPM_FILE}.bundle"

      - name: Generate .rpm checksum
        env:
          VERSION: ${{ inputs.version }}
        run: |
          RPM_FILE="sqry-${VERSION}-linux-x86_64.rpm"
          cd signed-linux
          sha256sum "$RPM_FILE" > CHECKSUMS-linux-rpm.sha256
          echo ".rpm checksum:"
          cat CHECKSUMS-linux-rpm.sha256

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-linux-rpm
          path: |
            signed-linux/sqry-*-linux-x86_64.rpm
            signed-linux/sqry-*-linux-x86_64.rpm.bundle
            signed-linux/CHECKSUMS-linux-rpm.sha256
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
