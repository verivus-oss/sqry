  # ===========================================================================
  # Job: Publish — Verify all artifacts, create GitHub Release, publish VSIX
  #
  # Environment: oss-release (requires human approval)
  # Downloads EXACT artifacts from build/package jobs — NO REBUILD behind gate.
  # ===========================================================================
  publish:
    name: Publish Vetted Artifacts
    needs:
      - build-linux-x86_64
      - build-linux-arm64
      - build-windows-x86_64
      - build-macos-arm64
      - build-vscode-extension
      - package-windows-msi
      - package-linux-deb
      - package-linux-rpm
      - provenance-linux-x86_64
      - provenance-linux-arm64
      - provenance-windows-x86_64
      - provenance-macos-arm64
      - provenance-vscode
    runs-on: ubuntu-latest
    environment: oss-release
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      # --- Step 0: Validate version ---
      - name: Validate version and enforce tag ref
        env:
          VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format: '$VERSION'"
            exit 1
          fi
          if [ "$REF_TYPE" != "tag" ] || [ "$REF_NAME" != "$VERSION" ]; then
            echo "::error::Must be dispatched from tag ref '$VERSION'"
            exit 1
          fi
          echo "Dispatch ref validated: refs/tags/${VERSION}"

      # --- Step 1: Download all signed build artifacts ---
      - name: Download all signed artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: signed-*
          path: dist/
          merge-multiple: false

      # --- Step 2: Download package artifacts ---
      - name: Download package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: package-*
          path: packages/
          merge-multiple: false

      # --- Step 3: Download provenance attestations ---
      - name: Download provenance — Linux x86_64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs['provenance-linux-x86_64'].outputs.provenance-name }}
          path: provenance/

      - name: Download provenance — Linux ARM64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs['provenance-linux-arm64'].outputs.provenance-name }}
          path: provenance/

      - name: Download provenance — Windows x86_64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs['provenance-windows-x86_64'].outputs.provenance-name }}
          path: provenance/

      - name: Download provenance — macOS ARM64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs['provenance-macos-arm64'].outputs.provenance-name }}
          path: provenance/

      - name: Download provenance — VSCode
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs['provenance-vscode'].outputs.provenance-name }}
          path: provenance/

      # --- Step 4: Verify per-platform checksums ---
      - name: Verify checksums
        id: verify_checksums
        run: |
          echo "Verifying checksums for all platforms..."
          FAIL=0

          # Verify signed build artifacts
          for dir in dist/signed-linux-x86_64 dist/signed-linux-arm64 dist/signed-windows-x86_64 dist/signed-macos-arm64 dist/signed-vscode; do
            if [ ! -d "$dir" ]; then
              echo "::error::Artifact directory missing: $dir"
              FAIL=1
              continue
            fi
            PLATFORM="${dir##*signed-}"
            CHECKSUM_FILE="$dir/CHECKSUMS-${PLATFORM}.sha256"
            if [ ! -f "$CHECKSUM_FILE" ]; then
              echo "::error::Expected checksum file missing: $CHECKSUM_FILE"
              FAIL=1
              continue
            fi
            echo "--- Verifying checksums in $dir ---"
            (cd "$dir" && sha256sum -c "$(basename "$CHECKSUM_FILE")")
            echo "Checksums OK: $dir"
          done

          # Verify package checksums
          for dir in packages/package-windows-msi packages/package-linux-deb packages/package-linux-rpm; do
            if [ ! -d "$dir" ]; then
              echo "::warning::Package directory missing: $dir (may not have been built)"
              continue
            fi
            CHECKSUM_FILE=$(find "$dir" -name 'CHECKSUMS-*.sha256' | head -1)
            if [ -n "$CHECKSUM_FILE" ]; then
              echo "--- Verifying checksums in $dir ---"
              (cd "$dir" && sha256sum -c "$(basename "$CHECKSUM_FILE")")
              echo "Checksums OK: $dir"
            fi
          done

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Checksum verification failed"
            exit 1
          fi
          echo "All checksums verified successfully"

      # --- Step 5: Install Cosign ---
      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      # --- Step 6: Verify all Cosign signatures ---
      - name: Verify Cosign signatures
        id: verify_signatures
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Escape dots for regex (v4.2.0 -> v4\.2\.0)
          VERSION_ESCAPED="${VERSION//./\\.}"
          CERT_IDENTITY="^https://github\\.com/verivus-oss/sqry/\\.github/workflows/oss-leg3-release\\.yml@refs/tags/${VERSION_ESCAPED}$"
          OIDC_ISSUER="https://token.actions.githubusercontent.com"

          echo "Verifying Cosign signatures -- identity bound to refs/tags/${VERSION}"
          echo ""

          FAIL=0
          # Verify signed build artifacts
          for dir in dist/signed-linux-x86_64 dist/signed-linux-arm64 dist/signed-windows-x86_64 dist/signed-macos-arm64 dist/signed-vscode; do
            if [ ! -d "$dir" ]; then
              echo "::error::Artifact directory missing: $dir"
              FAIL=1
              continue
            fi
            echo "--- Verifying signatures in $dir ---"
            for f in "$dir"/*; do
              [ -f "$f" ] || continue
              fname=$(basename "$f")
              [[ "$fname" == *.bundle ]] && continue
              [[ "$fname" == CHECKSUMS* ]] && continue
              bundle="${f}.bundle"
              if [ ! -f "$bundle" ]; then
                echo "::error::Bundle file missing for: $f"
                FAIL=1
                continue
              fi
              echo "  Verifying: $fname"
              cosign verify-blob \
                --bundle "$bundle" \
                --certificate-identity-regexp "$CERT_IDENTITY" \
                --certificate-oidc-issuer "$OIDC_ISSUER" \
                "$f"
              echo "  OK: $fname"
            done
          done

          # Verify package artifacts
          for dir in packages/package-windows-msi packages/package-linux-deb packages/package-linux-rpm; do
            if [ ! -d "$dir" ]; then
              continue
            fi
            echo "--- Verifying signatures in $dir ---"
            for f in "$dir"/*; do
              [ -f "$f" ] || continue
              fname=$(basename "$f")
              [[ "$fname" == *.bundle ]] && continue
              [[ "$fname" == CHECKSUMS* ]] && continue
              bundle="${f}.bundle"
              if [ ! -f "$bundle" ]; then
                # Not all package files necessarily have bundles
                continue
              fi
              echo "  Verifying: $fname"
              cosign verify-blob \
                --bundle "$bundle" \
                --certificate-identity-regexp "$CERT_IDENTITY" \
                --certificate-oidc-issuer "$OIDC_ISSUER" \
                "$f"
              echo "  OK: $fname"
            done
          done

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Cosign signature verification failed"
            exit 1
          fi
          echo "All Cosign signatures verified successfully"

      # --- Step 7: Checkout public repo for release notes ---
      - name: Checkout public repo for release notes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 1
          path: source-for-notes

      - name: Verify tag checkout
        working-directory: source-for-notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! git describe --tags --exact-match 2>/dev/null | grep -qE "^${VERSION}$"; then
            echo "::error::Checkout does not match tag '$VERSION'"
            exit 1
          fi
          echo "Tag '$VERSION' verified at $(git rev-parse --short HEAD)"

      # --- Step 8: Build release notes ---
      - name: Build release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION_ESCAPED="${VERSION//./\\.}"
          NOTES_FILE="/tmp/release-notes.md"

          NOTES=""
          if [ -f source-for-notes/CHANGELOG.md ]; then
            SECTION=$(sed -n "/^## \\[\\?${VERSION_ESCAPED}\\]\\?$/,/^## /p" source-for-notes/CHANGELOG.md | sed '$ d')
            if [ -n "$SECTION" ]; then
              NOTES="$SECTION"
              echo "Extracted changelog section for ${VERSION}"
            fi
          fi

          if [ -n "$NOTES" ]; then
            echo "$NOTES" > "$NOTES_FILE"
          else
            cat > "$NOTES_FILE" <<EOF
          ## sqry ${VERSION}

          Release of sqry semantic code search tool.

          See the [README](https://github.com/verivus-oss/sqry) for documentation.
          EOF
          fi

          # Append verification instructions
          cat >> "$NOTES_FILE" <<EOF

          ---

          ## Install

          Use the primary install path for your OS:

          ### Windows (recommended)
          \`\`\`powershell
          irm https://raw.githubusercontent.com/verivus-oss/sqry/main/scripts/install.ps1 | iex
          \`\`\`

          ### macOS and Linux (recommended)
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/verivus-oss/sqry/main/scripts/install.sh | bash -s -- --component all
          \`\`\`

          Published macOS binaries currently target Apple Silicon (\`arm64\`) only.
          Files ending in \`.bundle\` are verification artifacts for Cosign, not the programs you run directly.

          ---

          ## Verification

          All binaries, packages, and the VSCode extension are signed with [Sigstore Cosign](https://github.com/sigstore/cosign) using keyless OIDC signing, and SLSA Level 2 provenance attestations are included for all platforms.

          ### Verify checksums
          \`\`\`bash
          sha256sum -c CHECKSUMS.sha256
          \`\`\`

          ### Verify Cosign signatures
          \`\`\`bash
          cosign verify-blob \\
            --bundle sqry-linux-x86_64.bundle \\
            --certificate-identity-regexp \\
              "^https://github\\.com/verivus-oss/sqry/\\.github/workflows/oss-leg3-release\\.yml@refs/tags/${VERSION_ESCAPED}\$" \\
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \\
            sqry-linux-x86_64
          \`\`\`

          ### Verify SLSA Level 2 provenance
          \`\`\`bash
          slsa-verifier verify-artifact sqry-linux-x86_64 \\
            --provenance-path sqry-linux-x86_64-provenance.intoto.jsonl \\
            --source-uri github.com/verivus-oss/sqry
          \`\`\`
          EOF
          echo "Release notes prepared at $NOTES_FILE"

      # --- Step 9: Flatten all artifacts to release-assets/ ---
      - name: Flatten and consolidate artifacts
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release-assets

          # Copy signed build artifacts
          for dir in dist/signed-linux-x86_64 dist/signed-linux-arm64 dist/signed-windows-x86_64 dist/signed-macos-arm64 dist/signed-vscode; do
            if [ ! -d "$dir" ]; then
              echo "::error::Missing signed artifact directory: $dir"
              exit 1
            fi
            echo "--- Copying from $dir ---"
            for f in "$dir"/*; do
              [ -f "$f" ] || continue
              fname=$(basename "$f")
              cp "$f" "release-assets/$fname"
              echo "  Copied: $fname"
            done
          done

          # Copy package artifacts
          for dir in packages/package-windows-msi packages/package-linux-deb packages/package-linux-rpm; do
            if [ ! -d "$dir" ]; then
              echo "::warning::Package directory missing: $dir"
              continue
            fi
            echo "--- Copying from $dir ---"
            for f in "$dir"/*; do
              [ -f "$f" ] || continue
              fname=$(basename "$f")
              cp "$f" "release-assets/$fname"
              echo "  Copied: $fname"
            done
          done

          # Copy provenance attestations
          echo "--- Copying provenance attestations ---"
          for f in provenance/*; do
            [ -f "$f" ] || continue
            fname=$(basename "$f")
            cp "$f" "release-assets/$fname"
            echo "  Copied: $fname"
          done

          # Render package manager configs if available
          echo "--- Rendering package manager configs ---"
          if [ -d source-for-notes/packaging ] && [ -f source-for-notes/scripts/release/render-distribution-configs.sh ]; then
            source-for-notes/scripts/release/render-distribution-configs.sh \
              --version "$VERSION" \
              --checksums-dir release-assets \
              --output-dir release-assets/distribution \
              --repo verivus-oss/sqry

            while IFS= read -r rendered_file; do
              [ -f "$rendered_file" ] || continue
              relative_name="${rendered_file#release-assets/distribution/}"
              flat_name="${relative_name//\//-}"
              cp "$rendered_file" "release-assets/${flat_name}"
              echo "  Added distribution config: ${flat_name}"
            done < <(find release-assets/distribution -type f | sort)
          else
            echo "::warning::packaging dir or render script missing; skipping distribution config rendering"
          fi

          # Generate consolidated CHECKSUMS.sha256
          echo "--- Generating consolidated CHECKSUMS.sha256 ---"
          cd release-assets
          CHECKSUM_FILES=()
          for cf in CHECKSUMS-linux-x86_64.sha256 CHECKSUMS-linux-arm64.sha256 CHECKSUMS-windows-x86_64.sha256 CHECKSUMS-macos-arm64.sha256 CHECKSUMS-vscode.sha256; do
            [ -f "$cf" ] && CHECKSUM_FILES+=("$cf")
          done
          for cf in CHECKSUMS-windows-msi.sha256 CHECKSUMS-linux-deb.sha256 CHECKSUMS-linux-rpm.sha256; do
            [ -f "$cf" ] && CHECKSUM_FILES+=("$cf")
          done
          cat "${CHECKSUM_FILES[@]}" > CHECKSUMS.sha256
          echo "Consolidated checksums:"
          cat CHECKSUMS.sha256
          echo ""
          echo "--- All release assets ---"
          ls -lh .

      # --- Step 10: Create GitHub Release ---
      - name: Create GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          ASSET_PATHS=()
          for f in release-assets/*; do
            [ -f "$f" ] || continue
            ASSET_PATHS+=("$f")
          done

          echo "Creating GitHub Release ${VERSION} with ${#ASSET_PATHS[@]} assets..."
          gh release create "${VERSION}" \
            --repo "${REPO}" \
            --title "sqry ${VERSION}" \
            --notes-file /tmp/release-notes.md \
            --verify-tag \
            "${ASSET_PATHS[@]}"

          RELEASE_URL="https://github.com/${REPO}/releases/tag/${VERSION}"
          echo "release_url=${RELEASE_URL}" >> "$GITHUB_ENV"
          echo "GitHub Release created: ${RELEASE_URL}"

      # --- Step 11: Publish VSIX to Open VSX ---
      - name: Publish VSIX to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT not set -- skipping Open VSX publish"
            exit 0
          fi
          echo "::add-mask::$OVSX_PAT"
          VSIX_FILE="release-assets/sqry-vscode-${VERSION}.vsix"
          if [ ! -f "$VSIX_FILE" ]; then
            echo "::error::VSIX file not found: $VSIX_FILE"
            exit 1
          fi
          npx --yes ovsx publish "$VSIX_FILE" -p "$OVSX_PAT"
          echo "VSIX published to Open VSX"

      # --- Step 12: Post step summary ---
      - name: Post step summary
        if: always()
        env:
          VERSION: ${{ inputs.version }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CHECKSUM_STATUS: ${{ steps.verify_checksums.outcome }}
          SIGNATURE_STATUS: ${{ steps.verify_signatures.outcome }}
          RELEASE_STATUS: ${{ steps.create_release.outcome }}
        run: |
          RELEASE_URL="${release_url:-https://github.com/${REPOSITORY}/releases/tag/${VERSION}}"

          checksum_icon="$( [ "$CHECKSUM_STATUS" = "success" ] && echo "PASS" || echo "FAIL" )"
          signature_icon="$( [ "$SIGNATURE_STATUS" = "success" ] && echo "PASS" || echo "FAIL" )"
          release_icon="$( [ "$RELEASE_STATUS" = "success" ] && echo "PASS" || echo "FAIL" )"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## OSS Leg 3 Release: ${VERSION}

          | Step | Status |
          |------|--------|
          | Checksum verification (all platforms) | ${checksum_icon} |
          | Cosign signature verification (all platforms) | ${signature_icon} |
          | GitHub Release creation | ${release_icon} |

          **Release URL:** ${RELEASE_URL}

          ### Artifacts Published

          #### Linux x86_64 (musl static)
          - \`sqry-linux-x86_64\` + \`.bundle\`
          - \`sqry-mcp-linux-x86_64\` + \`.bundle\`
          - \`sqry-lsp-linux-x86_64\` + \`.bundle\`
          - \`sqry-${VERSION}-linux-x86_64.tar.gz\` + \`.bundle\`
          - \`sqry-linux-x86_64-provenance.intoto.jsonl\` (SLSA Level 2)

          #### Linux ARM64 (musl static)
          - \`sqry-linux-arm64\` + \`.bundle\`
          - \`sqry-mcp-linux-arm64\` + \`.bundle\`
          - \`sqry-lsp-linux-arm64\` + \`.bundle\`
          - \`sqry-${VERSION}-linux-arm64.tar.gz\` + \`.bundle\`
          - \`sqry-linux-arm64-provenance.intoto.jsonl\` (SLSA Level 2)

          #### Windows x86_64
          - \`sqry-windows-x86_64.exe\` + \`.bundle\`
          - \`sqry-mcp-windows-x86_64.exe\` + \`.bundle\`
          - \`sqry-lsp-windows-x86_64.exe\` + \`.bundle\`
          - \`sqry-${VERSION}-windows-x86_64.zip\` + \`.bundle\`
          - \`sqry-${VERSION}-windows-x86_64.msi\` + \`.bundle\`
          - \`sqry-windows-x86_64-provenance.intoto.jsonl\` (SLSA Level 2)

          #### macOS ARM64 (Apple Silicon)
          - \`sqry-macos-arm64\` + \`.bundle\`
          - \`sqry-mcp-macos-arm64\` + \`.bundle\`
          - \`sqry-lsp-macos-arm64\` + \`.bundle\`
          - \`sqry-${VERSION}-macos-arm64.pkg\` + \`.bundle\` (if Apple signing enabled)
          - \`sqry-macos-arm64-provenance.intoto.jsonl\` (SLSA Level 2)

          #### VSCode Extension
          - \`sqry-vscode-${VERSION}.vsix\` + \`.bundle\`
          - \`sqry-vscode-provenance.intoto.jsonl\` (SLSA Level 2)

          #### Linux Packages
          - \`sqry-${VERSION}-linux-amd64.deb\` + \`.bundle\`
          - \`sqry-${VERSION}-linux-x86_64.rpm\` + \`.bundle\`

          #### Consolidated
          - \`CHECKSUMS.sha256\` (all platforms combined)

          ### Supply Chain Security
          - All released binaries, packages, and VSIX signed with Cosign OIDC keyless -- identity bound to refs/tags/${VERSION}
          - SLSA Level 2 provenance attestations for all build platforms
          - Apple Developer ID codesign + notarization (if enabled)
          - SignPath Authenticode (if enabled + secrets present)
          - Cosign certificate identity verified to exact tag ref before publishing
          - Checksums verified before publishing

          **CI Run:** ${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}
          EOF
