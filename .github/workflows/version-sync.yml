name: Version Sync Check
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  check-version-sync:
    name: Check doc versions match Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version alignment
        run: scripts/sync-versions.sh
      - name: Report results
        if: failure()
        run: |
          echo "## Version Sync" >> $GITHUB_STEP_SUMMARY
          echo "Doc versions don't match Cargo.toml." >> $GITHUB_STEP_SUMMARY
          echo 'Run `scripts/sync-versions.sh --fix` locally.' >> $GITHUB_STEP_SUMMARY
