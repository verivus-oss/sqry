name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to test'
        required: true
        default: 'Linux'
        type: choice
        options:
          - Linux

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  setup:
    name: Setup Linux Matrix
    runs-on: [self-hosted, linux, rust, x86_64, workhorse2]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          echo 'matrix={"include":[{"platform":"Linux","rustflags":"-Dwarnings -C debuginfo=line-tables-only"}]}' >> "$GITHUB_OUTPUT"

  release-workflow-contracts:
    name: Release Workflow Contracts
    runs-on: [self-hosted, linux, rust, x86_64, workhorse2]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify release workflow OIDC contracts
        run: ./scripts/release/check-workflow-contracts.sh

  release-manifest-validation:
    name: Release manifest validation
    runs-on: [self-hosted, linux, rust, x86_64, workhorse2]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install Rust (for cargo metadata)
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - name: Validate release manifest
        run: |
          if [[ -f ./scripts/release/validate-manifest.sh ]]; then
            ./scripts/release/validate-manifest.sh
          else
            echo "validate-manifest.sh not present (expected on public repo) — skipping"
          fi

  test:
    name: Test (${{ matrix.platform }})
    needs: setup
    runs-on: [self-hosted, linux, rust, x86_64, workhorse2]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      # P2-3 Phase 3 Step 3: Zero-warnings gate enabled for all platforms
      # Line-tables-only debug info saves ~40% disk vs full debuginfo (prevents "No space left on device")
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure git credentials
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.90"

      - name: Report self-hosted runner disk
        if: matrix.platform == 'Linux'
        run: |
          echo "## Self-hosted Runner Disk Usage" >> $GITHUB_STEP_SUMMARY
          df -h >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Hosted-runner cleanup is intentionally disabled on self-hosted machines." >> $GITHUB_STEP_SUMMARY

      - name: Cache Rust dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ matrix.platform }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-${{ matrix.platform }}-

      - name: Build
        run: cargo build --locked --all --verbose
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
      - name: CLI smoke (sqry --help)
        # Windows debug builds overflow the default 1MB stack on --help
        # (deep clap subcommand tree). Skip on Windows; Build step validates.
        if: matrix.platform != 'Windows'
        run: cargo run --locked -p sqry-cli --bin sqry -- --help
      - name: Run tests
        run: cargo test --locked --all --verbose
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_PROFILE_TEST_DEBUG: 0

      - name: Malformed Input Tests (RR-09 WP-03)
        shell: bash
        run: |
          echo "## Malformed Input Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Testing all 34 language plugins with malformed inputs..." >> $GITHUB_STEP_SUMMARY

          RESULTS_FILE="${RUNNER_TEMP}/malformed-input-results.txt"
          cargo test --locked --workspace --test malformed_input 2>&1 | tee "$RESULTS_FILE"

          # Extract statistics (POSIX-compatible grep, no -P flag)
          TOTAL_PASSED=$(grep -o '[0-9]* passed' "$RESULTS_FILE" | grep -o '[0-9]*' | awk '{sum+=$1} END {print sum+0}')
          TOTAL_FAILED=$(grep -o '[0-9]* failed' "$RESULTS_FILE" | grep -o '[0-9]*' | awk '{sum+=$1} END {print sum+0}')
          TOTAL_IGNORED=$(grep -o '[0-9]* ignored' "$RESULTS_FILE" | grep -o '[0-9]*' | awk '{sum+=$1} END {print sum+0}')
          PLUGIN_COUNT=$(grep -c "test result:" "$RESULTS_FILE" || echo "0")

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Plugins Tested | $PLUGIN_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests Passed | $TOTAL_PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests Failed | $TOTAL_FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests Ignored | $TOTAL_IGNORED (stress tests) |" >> $GITHUB_STEP_SUMMARY

          if [ "${TOTAL_FAILED:-0}" -gt 0 ]; then
            echo "::error::Malformed input tests failed - FFI safety regression detected"
            exit 1
          else
            echo "All malformed input tests passed - FFI boundary is safe"
          fi

      # NOTE: Graphsync RKG check removed — graphsync is in workspace.exclude
      # (serde-saphyr/smallvec conflict with ort) so cargo run -p graphsync
      # always fails. Re-enable if graphsync is moved back into the workspace.


      - name: Cache pruning (Linux)
        if: matrix.platform == 'Linux'
        run: |
          # Free up space after tests (CI_FAILURE_REMEDIATION_PLAN.md Section 3)
          cargo clean -p sqry-lsp
          echo "## Post-Test Disk Usage" >> $GITHUB_STEP_SUMMARY
          df -h >> $GITHUB_STEP_SUMMARY

      - name: Warning count monitoring
        if: matrix.platform == 'Linux'
        run: |
          echo "## Warning Count Monitoring" >> $GITHUB_STEP_SUMMARY
          WARNING_COUNT=$(cargo build --locked --all 2>&1 | grep -c 'warning:' || echo "0")
          echo "**Warnings detected**: $WARNING_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "**Expected**: 0 (enforced via RUSTFLAGS=-Dwarnings)" >> $GITHUB_STEP_SUMMARY

  clippy:
    name: Clippy
    runs-on: [self-hosted, linux, rust, x86_64, workhorse2]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure git credentials
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.90"
          components: clippy

      - name: Cache Rust dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-clippy-
      - name: Run clippy
        run: cargo clippy --locked --all -- -D warnings

      - name: Unwrap usage check (advisory)
        # P2-37: Advisory lint for unwrap/expect - warns but doesn't fail build
        # See: docs/architecture/ERROR_HANDLING.md for guidelines
        run: |
          echo "## Unwrap/Expect Usage Check (P2-37)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Run clippy with unwrap_used and expect_used as warnings
          # This is advisory-only (won't fail build) to prevent CI friction
          cargo clippy --locked --all -- -W clippy::unwrap_used -W clippy::expect_used 2>&1 | tee /tmp/unwrap-lint.txt || true

          # Count warnings
          UNWRAP_WARNINGS=$(grep -c "unwrap_used\|expect_used" /tmp/unwrap-lint.txt || echo "0")

          echo "**Advisory warnings**: $UNWRAP_WARNINGS unwrap/expect usage findings" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This check is **advisory only** - it warns but does not fail the build." >> $GITHUB_STEP_SUMMARY
          echo "P2-37 Phase 1 audit validated 21 production unwraps as safe internal invariants." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Before adding new unwrap/expect:**" >> $GITHUB_STEP_SUMMARY
          echo "- Use \`Result<T>\` with \`.with_context()\` for I/O and user input" >> $GITHUB_STEP_SUMMARY
          echo "- Document invariants with \`# Panics\` for internal assertions" >> $GITHUB_STEP_SUMMARY
          echo "- See [ERROR_HANDLING.md](docs/architecture/ERROR_HANDLING.md)" >> $GITHUB_STEP_SUMMARY

  fmt:
    name: Rustfmt
    runs-on: [self-hosted, linux, rust, x86_64, workhorse2]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.90"
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  docs:
    name: Documentation
    runs-on: [self-hosted, linux, rust, x86_64, workhorse2]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure git credentials
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.90"

      - name: Cache Rust dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-docs-
      - name: Build documentation
        run: cargo doc --locked --all --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  fuzzy-jaccard-modes:
    name: Fuzzy Search - ${{ matrix.mode }}
    runs-on: [self-hosted, linux, rust, x86_64, workhorse2]
    strategy:
      matrix:
        include:
          - mode: Jaccard (default)
            env_var: "1"
          - mode: Ratio (fallback)
            env_var: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure git credentials
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@v2
      - name: Test fuzzy search with ${{ matrix.mode }}
        run: cargo test --locked -p sqry-core search::fuzzy::tests
        env:
          SQRY_FUZZY_USE_JACCARD: ${{ matrix.env_var }}

  security:
    name: Security Audit
    # RKG: implements REQ:SQRY-SECURITY-AUDIT-AUTOMATION
    runs-on: [self-hosted, linux, rust, x86_64, workhorse2]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure git credentials
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.90"

      - name: Cache Rust dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: rust-security-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-security-

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit || true

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny || true

      - name: Run cargo-audit
        run: cargo audit

      - name: Run cargo-deny
        run: cargo deny check

      - name: Install cargo-vet
        run: cargo install --locked cargo-vet || true

      - name: Run cargo-vet (supply-chain audit)
        shell: bash
        run: |
          set -o pipefail
          cargo vet --locked 2>&1 | tee cargo-vet.log

      - name: Summarize Dependabot cargo-vet failure
        if: failure() && github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/cargo/')
        shell: bash
        run: |
          unvetted_line="$(grep -m1 -E '^[[:space:]]+[^[:space:]]+:[^[:space:]]+ missing \["safe-to-deploy"\]' cargo-vet.log || true)"
          {
            echo "## Dependency PR Vet Failure"
            echo ""
            echo "This failure is from a Dependabot cargo update PR, not a release-tag regression."
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Actor | \`${GITHUB_ACTOR}\` |"
            echo "| Branch | \`${GITHUB_HEAD_REF}\` |"
            echo "| Ref | \`${GITHUB_REF}\` |"
            echo "| Head SHA | \`${GITHUB_SHA}\` |"
            if [ -n "$unvetted_line" ]; then
              echo "| Unvetted dependency | \`$(printf '%s' "$unvetted_line" | sed 's/^[[:space:]]*//; s/ missing.*$//')\` |"
            fi
            echo ""
            echo "Next action: review the bumped crate version and update \`supply-chain/config.toml\` with the correct \`cargo vet\` exemption or audit entry."
          } >> "$GITHUB_STEP_SUMMARY"
