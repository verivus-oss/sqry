# .github/workflows/fuzz-parse.yml
#
# Nightly cargo-fuzz run against sqry-db::planner::parse::parse_query.
#
# Purpose: exercise the structural query planner text parser against
# arbitrary byte inputs and verify it never panics on any valid UTF-8
# string, regardless of how malformed the query syntax is.
#
# Trigger: nightly schedule (04:00 UTC) + manual workflow_dispatch.
# NOT triggered on pull_request — fuzz runs are nightly-only per DAG
# unit U_WS1_13_FUZZ (docs/superpowers/plans/2026-05-25-graph-fidelity-
# planner-correctness-dag.toml §WS1).
#
# On crash: corpus + crash artifacts are uploaded as workflow artifacts
# (retained 90 days). Issue filing on crash is a follow-up
# (deferred — see docs/superpowers/plans/2026-05-25-graph-fidelity-
# planner-correctness-dag.toml §WS1 issue-on-crash note).
#
# Security note: this workflow does not interpolate any untrusted
# github.event.* inputs into run: commands.

name: fuzz-parse

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: fuzz-parse-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fuzz:
    name: fuzz planner::parse (10 min)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Free disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          df -h /

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        # --locked is intentionally omitted: cargo-fuzz's transitive
        # dependencies (rustix) must resolve against whatever nightly is
        # installed, and the published Cargo.lock for cargo-fuzz is not
        # always forward-compatible with the latest nightly toolchain.
        run: cargo +nightly install cargo-fuzz

      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-fuzz-parse-${{ hashFiles('sqry-db/fuzz/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-parse-
            ${{ runner.os }}-cargo-

      - name: Cache fuzz target/
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: sqry-db/fuzz/target/
          key: ${{ runner.os }}-fuzz-parse-target-${{ hashFiles('sqry-db/fuzz/Cargo.toml', 'sqry-db/src/planner/parse.rs') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-parse-target-

      - name: Build fuzz target
        working-directory: sqry-db/fuzz
        run: cargo +nightly fuzz build parse

      - name: Run fuzz (10 min)
        working-directory: sqry-db/fuzz
        run: |
          cargo +nightly fuzz run parse -- \
            -max_total_time=600 \
            -print_final_stats=1

      - name: Upload corpus and crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-parse-crashes-${{ github.run_id }}
          path: |
            sqry-db/fuzz/corpus/parse/
            sqry-db/fuzz/artifacts/parse/
          retention-days: 90

      - name: File issue on crash
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # These temporary files are never read after the filer returns, and a
          # self-hosted fuzz runner is long lived, so they accumulate. Round 2 of
          # review measured 24 left behind per harness run (codex).
          fuzz_issue_scratch=()
          cleanup_scratch() {
            if ((${#fuzz_issue_scratch[@]} > 0)); then
              rm -f "${fuzz_issue_scratch[@]}"
            fi
          }
          trap cleanup_scratch EXIT

          # The title is the deduplication key, so the run id stays out of it
          # and lives in the body and the per-run comment instead.
          title="fuzz-parse crash detected"

          run_detail_file="$(mktemp)"
          fuzz_issue_scratch+=("$run_detail_file")
          cat >"$run_detail_file" <<EOF
          Run: ${RUN_URL}

          Crash artifacts are attached to the workflow run as \`fuzz-parse-crashes-${RUN_ID}\` and retained for 90 days.

          Triage: download the artifact, then from \`sqry-db/fuzz/\` run
          \`cargo +nightly fuzz run parse <crash-input>\`.
          EOF

          body_file="$(mktemp)"
          fuzz_issue_scratch+=("$body_file")
          {
            cat <<'EOF'
          The nightly `fuzz-parse` workflow detected a crash in
          `sqry_db::planner::parse::parse_query`.

          EOF
            cat "$run_detail_file"
            echo
            echo "Later runs that reproduce this finding are added as comments"
            echo "rather than as new issues."
          } >"$body_file"

          comment_file="$(mktemp)"
          fuzz_issue_scratch+=("$comment_file")
          {
            echo "Reproduced by a later run of fuzz-parse (run \`${RUN_ID}\`)."
            echo
            cat "$run_detail_file"
          } >"$comment_file"

          scripts/ci/file-fuzz-issue.sh \
            --title "$title" \
            --body-file "$body_file" \
            --comment-file "$comment_file" \
            --label "bug,fuzz"
