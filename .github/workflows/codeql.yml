name: CodeQL

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: [self-hosted, linux, rust, x86_64, workhorse2]
    # Public sqry is primarily Rust plus workflow and extension code.
    # We intentionally scan the security-relevant maintained languages here
    # and do not enable CodeQL for generated/vendor-heavy incidental sources.
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          languages: ${{ matrix.language }}
          # GitHub supports no-build extraction for Rust in advanced setup.
          build-mode: ${{ matrix.build-mode }}
          # The self-hosted staging runner advertises far more memory/CPU
          # than CodeQL can reliably reserve under concurrent release load.
          ram: 8192
          threads: 4
          queries: security-extended,security-and-quality
          config: |
            paths-ignore:
              - vendor
              - third-party
              - test-fixtures
              - crates/tree-sitter-*
              - '**/node_modules'

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          category: /language:${{ matrix.language }}
          ram: 8192
          threads: 4
