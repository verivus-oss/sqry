name: Release Runner Setup Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release-runner-setup:
    name: Validate release runner setup
    runs-on: [self-hosted, linux, rust, x86_64, workhorse2]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate setup-runner.sh
        run: |
          set -euo pipefail
          sudo scripts/release/setup-runner.sh
