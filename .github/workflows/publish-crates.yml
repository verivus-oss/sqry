# publish-crates.yml — Publish all sqry crates to crates.io
#
# Publishes workspace crates in dependency order with rate limit handling.
# Authenticates via Azure OIDC → Key Vault → crates.io API token.
#
# Usage: dispatch manually after a release tag is pushed.

name: "Publish to crates.io"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v4.10.0) — must match the checked-out tag, public GitHub Release, and workspace version"
        required: true
        type: string
      from_crate:
        description: "Resume from crate (skip already-published). Leave empty to publish all."
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-crates
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  FROM_CRATE: ${{ inputs.from_crate }}

jobs:
  publish:
    name: Publish crates
    runs-on: [self-hosted, linux, rust]
    timeout-minutes: 120
    environment: oss-release
    steps:
      - name: Validate version input and dispatch ref
        env:
          VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format: '$VERSION'"
            exit 1
          fi
          if [ "$REF_TYPE" != "tag" ] || [ "$REF_NAME" != "$VERSION" ]; then
            echo "::error::This workflow must be dispatched from the '$VERSION' tag ref."
            echo "::error::Current ref: type='$REF_TYPE' name='$REF_NAME'"
            exit 1
          fi

      - name: Checkout at release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 1

      - name: Verify checked-out tag and workspace version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! git describe --tags --exact-match 2>/dev/null | grep -qE "^${VERSION}$"; then
            echo "::error::Checkout does not match tag '$VERSION'"
            exit 1
          fi

          VERSION_NO_V="${VERSION#v}"
          WORKSPACE_VERSION="$(awk '
            /^\[workspace\.package\]/ { in_block=1; next }
            /^\[/ && in_block { exit }
            in_block && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"

          if [ -z "$WORKSPACE_VERSION" ]; then
            echo "::error::Could not determine [workspace.package].version from Cargo.toml"
            exit 1
          fi
          if [ "$WORKSPACE_VERSION" != "$VERSION_NO_V" ]; then
            echo "::error::Tag '$VERSION' does not match workspace version '$WORKSPACE_VERSION'"
            exit 1
          fi

      - name: Verify public GitHub Release exists and is published
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          release_json="$(gh release view "$VERSION" --repo "$REPO" --json tagName,isDraft,isPrerelease,url 2>/dev/null)" || {
            echo "::error::Public GitHub Release '$VERSION' does not exist on $REPO"
            exit 1
          }

          release_tag="$(jq -r '.tagName' <<< "$release_json")"
          release_is_draft="$(jq -r '.isDraft' <<< "$release_json")"
          release_is_prerelease="$(jq -r '.isPrerelease' <<< "$release_json")"
          release_url="$(jq -r '.url' <<< "$release_json")"

          if [ "$release_tag" != "$VERSION" ]; then
            echo "::error::Release tag mismatch: expected '$VERSION', got '$release_tag'"
            exit 1
          fi
          if [ "$release_is_draft" != "false" ]; then
            echo "::error::Release '$VERSION' is still a draft: $release_url"
            exit 1
          fi
          if [ "$release_is_prerelease" != "false" ]; then
            echo "::error::Release '$VERSION' is still marked prerelease: $release_url"
            exit 1
          fi
          echo "Verified public GitHub Release: $release_url"

      - name: Azure OIDC login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get crates.io publish token from Key Vault
        id: token
        run: |
          TOKEN=$(az keyvault secret show \
            --vault-name verivus-dev-secrets-kv \
            --name crates-io-publish-token \
            --query value -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Publish all crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          FROM_ARG=""
          if [ -n "$FROM_CRATE" ]; then
            FROM_ARG="--from $FROM_CRATE"
          fi
          chmod +x scripts/publish-to-crates-io.sh
          ./scripts/publish-to-crates-io.sh $FROM_ARG

      - name: Post summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## crates.io Publish Results"
            echo ""
            echo "- Version: \`${RELEASE_VERSION}\`"
            echo "- Public release gate: \`$(gh release view "$RELEASE_VERSION" --repo "$REPO" --json url --jq '.url' 2>/dev/null || echo unavailable)\`"
            echo "- Verify: \`cargo install sqry-cli@${RELEASE_VERSION#v}\`"
            echo "- Registry: https://crates.io/crates/sqry-cli"
          } >> "$GITHUB_STEP_SUMMARY"
