# =============================================================================
# DEPRECATED: This workflow is superseded by oss-release.yml
#
# oss-release.yml now covers all 3 platforms (Linux x86_64, Windows x86_64,
# macOS ARM64) × 3 binaries (sqry, sqry-mcp, sqry-lsp) + VSCode extension,
# with SLSA Level 2 provenance and Cosign keyless signing using the PUBLIC
# identity (verivusOSS-releases/sqry). That workflow is the canonical public
# release mechanism for the OSS pipeline.
#
# This file builds against the INTERNAL repo (verivus-oss/sqry) and uses
# the internal signing identity. It is kept for reference and internal audit
# trail purposes. It MUST NOT be used for new public releases.
# =============================================================================

name: Sign Release + SLSA Provenance [DEPRECATED]

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DEPRECATED — use oss-release.yml instead. Dry run only (no upload).'
        required: false
        default: 'true'

permissions:
  id-token: write    # For Sigstore OIDC
  contents: write    # For release asset upload

jobs:
  tests:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git credentials for internal repos
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        env:
          # split-debuginfo=unpacked keeps debug info in separate .dwo files
          # This reduces linker memory usage by ~87% (debug info is 87% of object file size)
          # See: https://blog.quarticcat.com/posts/no-more-oom/
          RUSTFLAGS: "-Csplit-debuginfo=unpacked"
        # Skip benchmarks (--benches) as they require fixtures not present in CI
        run: cargo test --workspace --lib --bins --tests

  # Build and sign jobs - one per platform to enable per-platform SLSA provenance

  build-and-sign-linux:
    name: Build & Sign - Linux x86_64
    # Tests run in parallel - upload-release gate ensures tests pass before release
    runs-on: ubuntu-latest
    outputs:
      subjects: ${{ steps.hash.outputs.subjects }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SLSA provenance
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git credentials for internal repos
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      - name: Build release binary
        env:
          RUSTFLAGS: "-Csplit-debuginfo=unpacked"
          CARGO_BUILD_JOBS: "2"
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Prepare dist directory with all binaries
        shell: bash
        run: |
          mkdir -p dist
          cp "target/x86_64-unknown-linux-gnu/release/sqry" "dist/sqry-linux-x86_64"
          cp "target/x86_64-unknown-linux-gnu/release/sqry-mcp" "dist/sqry-mcp-linux-x86_64"
          cp "target/x86_64-unknown-linux-gnu/release/sqry-lsp" "dist/sqry-lsp-linux-x86_64"
          chmod 755 dist/*
          echo "Prepared binaries for Linux x86_64:"
          ls -lh dist/

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Sign all binaries with Cosign
        shell: bash
        run: |
          cd dist
          echo "Signing all binaries for Linux x86_64..."
          for binary in sqry-* ; do
            [[ "$binary" == *.bundle ]] && continue
            [[ "$binary" == CHECKSUMS* ]] && continue
            echo "  Signing ${binary}..."
            cosign sign-blob --yes --bundle "${binary}.bundle" "${binary}"
            echo "  ✓ Signed: ${binary}.bundle"
          done
          echo "All binaries signed successfully"

      - name: Generate checksums and SLSA subjects
        id: hash
        shell: bash
        run: |
          cd dist
          sha256sum sqry-* | grep -v ".bundle" > CHECKSUMS.sha256
          echo "Generated checksums for Linux x86_64:"
          cat CHECKSUMS.sha256

          # Build base64-encoded subjects list for SLSA provenance (correct JSON format)
          subjects=""
          for binary in sqry-*; do
            [[ "$binary" == CHECKSUMS* ]] && continue
            [[ "$binary" == *.bundle ]] && continue
            digest=$(sha256sum "$binary" | awk '{print $1}')
            # Create proper JSON object with name and digest fields
            subject_json=$(jq -n --arg name "$binary" --arg hash "$digest" '{name: $name, digest: {sha256: $hash}}')
            subject=$(echo -n "$subject_json" | base64 -w0)
            subjects="${subjects}${subject}"$'\n'
            echo "Added SLSA subject: $binary (sha256: ${digest:0:16}...)"
          done
          subjects="${subjects%$'\n'}"
          echo "subjects<<EOF" >> "$GITHUB_OUTPUT"
          echo "$subjects" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "SLSA subjects prepared for Linux x86_64"

      - name: Upload all signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-linux-x86_64
          path: dist/*
          retention-days: 5

  build-and-sign-windows:
    name: Build & Sign - Windows x86_64
    # Tests run in parallel - upload-release gate ensures tests pass before release
    runs-on: windows-latest
    outputs:
      subjects: ${{ steps.hash.outputs.subjects }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git credentials for internal repos
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
          targets: x86_64-pc-windows-msvc

      - name: Configure cargo to use git CLI
        shell: bash
        run: |
          mkdir -p ~/.cargo
          echo '[net]' >> ~/.cargo/config.toml
          echo 'git-fetch-with-cli = true' >> ~/.cargo/config.toml

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare dist directory with all binaries
        shell: bash
        run: |
          mkdir -p dist
          cp "target/x86_64-pc-windows-msvc/release/sqry.exe" "dist/sqry-windows-x86_64.exe"
          cp "target/x86_64-pc-windows-msvc/release/sqry-mcp.exe" "dist/sqry-mcp-windows-x86_64.exe"
          cp "target/x86_64-pc-windows-msvc/release/sqry-lsp.exe" "dist/sqry-lsp-windows-x86_64.exe"
          echo "Prepared binaries for Windows x86_64:"
          ls -lh dist/

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Sign all binaries with Cosign
        shell: bash
        run: |
          cd dist
          echo "Signing all binaries for Windows x86_64..."
          for binary in sqry-*; do
            [[ "$binary" == *.bundle ]] && continue
            [[ "$binary" == CHECKSUMS* ]] && continue
            echo "  Signing ${binary}..."
            cosign sign-blob --yes --bundle "${binary}.bundle" "${binary}"
            echo "  ✓ Signed: ${binary}.bundle"
          done
          echo "All binaries signed successfully"

      - name: Generate checksums and SLSA subjects
        id: hash
        shell: powershell
        run: |
          cd dist

          # Generate checksums using PowerShell Get-FileHash
          $files = Get-ChildItem -Filter "sqry-*.exe" | Where-Object { $_.Name -notlike "*.bundle" }
          $checksums = @()
          foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $file.Name).Hash.ToLower()
            $checksums += "$hash  $($file.Name)"
          }
          $checksums | Out-File -FilePath "CHECKSUMS.sha256" -Encoding ASCII
          Write-Host "Generated checksums for Windows x86_64:"
          Get-Content "CHECKSUMS.sha256"

          # Build base64-encoded subjects list for SLSA provenance (correct JSON format)
          $subjects = @()
          foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $file.Name).Hash.ToLower()
            # Create proper JSON object with name and digest fields
            $subjectObj = @{
              name = $file.Name
              digest = @{
                sha256 = $hash
              }
            } | ConvertTo-Json -Compress
            $subjectBytes = [System.Text.Encoding]::UTF8.GetBytes($subjectObj)
            $subjectBase64 = [System.Convert]::ToBase64String($subjectBytes)
            $subjects += $subjectBase64
            $hashPreview = $hash.Substring(0, 16)
            Write-Host "Added SLSA subject: $($file.Name) (sha256: ${hashPreview}...)"
          }

          # Output subjects as multiline string
          $subjectsOutput = $subjects -join "`n"
          "subjects<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ASCII
          $subjectsOutput | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ASCII
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ASCII
          Write-Host "SLSA subjects prepared for Windows x86_64"

      - name: Upload all signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows-x86_64
          path: dist/*
          retention-days: 5

  build-and-sign-macos-intel:
    name: Build & Sign - macOS x86_64 (Intel)
    # Tests run in parallel - upload-release gate ensures tests pass before release
    runs-on: macos-15-large
    outputs:
      subjects: ${{ steps.hash.outputs.subjects }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
