          ## What is SLSA Level 2?

          SLSA (Supply-chain Levels for Software Artifacts) Level 2 provides:
          - **Build provenance**: Cryptographically signed attestation of how the binary was built
          - **Source integrity**: Links the binary to the exact source commit
          - **Non-falsifiable**: Generated by GitHub Actions using OIDC tokens (no long-lived secrets)

          This means you can verify that:
          1. The binary was built from the claimed source repository and commit
          2. The build happened on GitHub Actions (not a developer's laptop)
          3. The binary hasn't been tampered with since it was built
