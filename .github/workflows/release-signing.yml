          cp "target/aarch64-apple-darwin/release/sqry-mcp" "dist/sqry-mcp-macos-arm64"
          cp "target/aarch64-apple-darwin/release/sqry-lsp" "dist/sqry-lsp-macos-arm64"
          chmod 755 dist/*
          echo "Prepared binaries for macOS ARM64:"
          ls -lh dist/

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Sign all binaries with Cosign
        shell: bash
        run: |
          cd dist
          echo "Signing all binaries for macOS ARM64..."
          for binary in sqry-*; do
            [[ "$binary" == *.bundle ]] && continue
            [[ "$binary" == CHECKSUMS* ]] && continue
            echo "  Signing ${binary}..."
            cosign sign-blob --yes --bundle "${binary}.bundle" "${binary}"
            echo "  ✓ Signed: ${binary}.bundle"
          done
          echo "All binaries signed successfully"

      - name: Generate checksums and SLSA subjects
        id: hash
        shell: bash
        run: |
          cd dist
          shasum -a 256 sqry-* | grep -v ".bundle" > CHECKSUMS.sha256
          echo "Generated checksums for macOS ARM64:"
          cat CHECKSUMS.sha256

          # Build base64-encoded subjects list for SLSA provenance (correct JSON format)
          subjects=""
          for binary in sqry-*; do
            [[ "$binary" == CHECKSUMS* ]] && continue
            [[ "$binary" == *.bundle ]] && continue
            digest=$(shasum -a 256 "$binary" | awk '{print $1}')
            # Create proper JSON object with name and digest fields
            subject_json=$(jq -n --arg name "$binary" --arg hash "$digest" '{name: $name, digest: {sha256: $hash}}')
            subject=$(echo -n "$subject_json" | base64)
            subjects="${subjects}${subject}"$'\n'
            echo "Added SLSA subject: $binary (sha256: ${digest:0:16}...)"
          done
          subjects="${subjects%$'\n'}"
          echo "subjects<<EOF" >> "$GITHUB_OUTPUT"
          echo "$subjects" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "SLSA subjects prepared for macOS ARM64"

      - name: Upload all signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-macos-arm64
          path: dist/*
          retention-days: 5

  # SLSA Level 2 Provenance Generation (Per-Platform)
  # Each platform gets its own provenance attestation for the 3 binaries built on that platform

  provenance-linux:
    name: SLSA Provenance - Linux x86_64
    needs: [build-and-sign-linux]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build-and-sign-linux.outputs.subjects }}"
      upload-assets: ${{ startsWith(github.ref, 'refs/tags/') }}
      provenance-name: sqry-linux-x86_64-provenance.intoto.jsonl
      compile-generator: false
      private-repository: true
    secrets: inherit

  provenance-windows:
    name: SLSA Provenance - Windows x86_64
    needs: [build-and-sign-windows]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build-and-sign-windows.outputs.subjects }}"
      upload-assets: ${{ startsWith(github.ref, 'refs/tags/') }}
      provenance-name: sqry-windows-x86_64-provenance.intoto.jsonl
      compile-generator: false
      private-repository: true
    secrets: inherit

  provenance-macos-intel:
    name: SLSA Provenance - macOS x86_64
    needs: [build-and-sign-macos-intel]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build-and-sign-macos-intel.outputs.subjects }}"
      upload-assets: ${{ startsWith(github.ref, 'refs/tags/') }}
      provenance-name: sqry-macos-x86_64-provenance.intoto.jsonl
      compile-generator: false
      private-repository: true
    secrets: inherit

  provenance-macos-arm:
    name: SLSA Provenance - macOS ARM64
    needs: [build-and-sign-macos-arm]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build-and-sign-macos-arm.outputs.subjects }}"
      upload-assets: ${{ startsWith(github.ref, 'refs/tags/') }}
      provenance-name: sqry-macos-arm64-provenance.intoto.jsonl
      compile-generator: false
      private-repository: true
    secrets: inherit

  # Upload all artifacts to release
  upload-release:
    name: Upload to GitHub Release
    # Tests must pass before releasing (tests run in parallel with builds)
    needs: [tests, build-and-sign-linux, build-and-sign-windows, build-and-sign-macos-intel, build-and-sign-macos-arm,
            provenance-linux, provenance-windows, provenance-macos-intel, provenance-macos-arm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true')

    steps:
      - name: Download all signed artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: signed-*
          path: artifacts/
          merge-single: false

      - name: Organize artifacts
        shell: bash
        run: |
          mkdir -p dist
          # Move all artifacts from subdirectories to dist
          find artifacts -type f -exec mv {} dist/ \;
          ls -lh dist/

      - name: Generate consolidated checksums
        shell: bash
        run: |
          cd dist
          # Consolidate all CHECKSUMS.sha256 files
          cat CHECKSUMS.sha256.* 2>/dev/null > CHECKSUMS-ALL.sha256 || true
          # Also generate individual checksums for each binary
          for binary in sqry-*; do
            [[ "$binary" == *.bundle ]] && continue
            [[ "$binary" == CHECKSUMS* ]] && continue
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$binary" >> CHECKSUMS-ALL.sha256
            else
              shasum -a 256 "$binary" >> CHECKSUMS-ALL.sha256
            fi
          done
          mv CHECKSUMS-ALL.sha256 CHECKSUMS.sha256
          echo "=== Consolidated Checksums ==="
          cat CHECKSUMS.sha256

      - name: Generate verification instructions
        run: |
          cat > dist/VERIFY.md <<'EOF'
          # Verification Instructions - Multi-Platform Release with SLSA Level 2

          This release includes **3 binaries** for each of 4 platforms (12 binaries total):
          - **sqry**: Main CLI tool
          - **sqry-mcp**: MCP (Model Context Protocol) server
          - **sqry-lsp**: LSP (Language Server Protocol) server

          Each platform also includes **SLSA Level 2 provenance attestations** for supply chain verification.

          ## Platforms & Binaries Available

          ### Linux x86_64
          - `sqry-linux-x86_64`, `sqry-mcp-linux-x86_64`, `sqry-lsp-linux-x86_64`
          - Provenance: `sqry-linux-x86_64-provenance.intoto.jsonl`

          ### Windows x86_64
          - `sqry-windows-x86_64.exe`, `sqry-mcp-windows-x86_64.exe`, `sqry-lsp-windows-x86_64.exe`
          - Provenance: `sqry-windows-x86_64-provenance.intoto.jsonl`

          ### macOS Intel x86_64
          - `sqry-macos-x86_64`, `sqry-mcp-macos-x86_64`, `sqry-lsp-macos-x86_64`
          - Provenance: `sqry-macos-x86_64-provenance.intoto.jsonl`

          ### macOS ARM64 (Apple Silicon)
          - `sqry-macos-arm64`, `sqry-mcp-macos-arm64`, `sqry-lsp-macos-arm64`
          - Provenance: `sqry-macos-arm64-provenance.intoto.jsonl`

          ## Quick Verification

          ```bash
          # Verify all checksums
          sha256sum -c CHECKSUMS.sha256  # Linux
          shasum -a 256 -c CHECKSUMS.sha256  # macOS/Windows
          ```

          ## Verify Cosign Signatures

          All binaries are signed with Sigstore/Cosign. Replace `<binary-name>` with the specific binary you want to verify.

          ### Linux Example
          ```bash
          cosign verify-blob \
            --bundle sqry-linux-x86_64.bundle \
            --certificate-identity-regexp "^https://github.com/verivus-oss/sqry/\\.github/workflows/release-signing\\.yml@" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            sqry-linux-x86_64
          ```

          ### Windows Example (PowerShell)
          ```powershell
          cosign verify-blob `
            --bundle sqry-windows-x86_64.exe.bundle `
            --certificate-identity-regexp "^https://github.com/verivus-oss/sqry/\\.github/workflows/release-signing\\.yml@" `
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" `
            sqry-windows-x86_64.exe
          ```

          ### macOS Example
          ```bash
          cosign verify-blob \
            --bundle sqry-macos-arm64.bundle \
            --certificate-identity-regexp "^https://github.com/verivus-oss/sqry/\\.github/workflows/release-signing\\.yml@" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            sqry-macos-arm64
          ```

          ## Verify SLSA Level 2 Provenance

          Each platform has its own provenance attestation. Use `slsa-verifier` to verify.

          ### Install slsa-verifier

          ```bash
          # Linux
