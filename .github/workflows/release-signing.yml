          cp "target/x86_64-apple-darwin/release/sqry-mcp" "dist/sqry-mcp-macos-x86_64"
          cp "target/x86_64-apple-darwin/release/sqry-lsp" "dist/sqry-lsp-macos-x86_64"
          chmod 755 dist/*
