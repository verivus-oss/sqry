            digest=$(shasum -a 256 "$binary" | awk '{print $1}')
            # Create proper JSON object with name and digest fields
            subject_json=$(jq -n --arg name "$binary" --arg hash "$digest" '{name: $name, digest: {sha256: $hash}}')
            subject=$(echo -n "$subject_json" | base64)
            subjects="${subjects}${subject}"$'\n'
            echo "Added SLSA subject: $binary (sha256: ${digest:0:16}...)"
          done
          subjects="${subjects%$'\n'}"
          echo "subjects<<EOF" >> "$GITHUB_OUTPUT"
          echo "$subjects" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "SLSA subjects prepared for macOS x86_64"

      - name: Upload all signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-macos-x86_64
          path: dist/*
          retention-days: 5

  build-and-sign-macos-arm:
    name: Build & Sign - macOS ARM64 (Apple Silicon)
    # Tests run in parallel - upload-release gate ensures tests pass before release
    runs-on: macos-14
    outputs:
      subjects: ${{ steps.hash.outputs.subjects }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git credentials for internal repos
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
