# RustSec Audit Configuration
# RR-12: Dependency Hygiene - CVE exception tracking
# See: docs/development/p2-37-unwrap-audit/RR12_DEPENDENCY_HYGIENE_ANALYSIS.md

# RUSTSEC-2023-0071: Marvin Attack: potential key recovery through timing sidechannels
#
# Crate: rsa 0.9.9
# Severity: 5.9/10 (Medium)
# Date: 2023-11-22
#
# RATIONALE FOR ACCEPTANCE:
# sqry does NOT perform RSA decryption operations. The RSA crate is pulled in
# via the Lance/OpenDAL storage layer (6 levels deep: rsa → reqsign → opendal
# → object_store_opendal → lance-io → sqry-core) for cloud storage authentication
# (S3, Azure, GCS signatures).
#
# The Marvin Attack exploits timing sidechannels during RSA decryption to recover
# private keys. sqry's primary use case is local file indexing and semantic search,
# which does not expose RSA key material to attackers. The vulnerability is not
# exploitable in sqry's context.
#
# MITIGATION:
# - Monitor for Lance 0.40+ releases (may update opendal/reqsign stack)
# - Re-evaluate when upstream dependencies address the issue
# - If cloud storage integration becomes a primary feature, revisit this exception
#
# Documented in: RR12_DEPENDENCY_HYGIENE_ANALYSIS.md
# Accepted by: Claude (RR-12 Analysis, 2025-11-23)
# Expires: 2026-06-01 (6 months - re-evaluate after Lance ecosystem updates)

# ============================================================================
# RUSTSEC-2025-0119: number_prefix crate is unmaintained
#
# Crate: number_prefix 0.4.0
# Severity: Informational (unmaintained)
# Date: 2025-11-17
#
# RATIONALE FOR ACCEPTANCE:
# number_prefix is a small formatting library (converts numbers to human-readable
# strings like "1.5 MB"). It is pulled in via: indicatif → hf-hub → sqry-core
# (embeddings feature only).
#
# RISK ASSESSMENT: LOW
# 1. Compile-time/formatting only - no runtime security surface
# 2. Simple, stable codebase (~200 LOC) - unlikely to have latent bugs
# 3. Used only in optional embeddings feature (not default build)
# 4. Transitive dependency (3 levels deep) - not directly controlled
#
# MITIGATION:
# - Monitor for indicatif updates (may switch to maintained alternative)
# - Consider replacing hf-hub if embeddings feature matures
# - Quarterly review of unmaintained dependencies
#
# Documented in: RR12_DEPENDENCY_HYGIENE_ANALYSIS.md
# Accepted by: Claude (RR-12 Task #1 Cleanup, 2025-11-23)
# Expires: 2026-06-01 (re-evaluate with embeddings feature review)

# ============================================================================
# RUSTSEC-2024-0436: paste - no longer maintained
#
# Crate: paste 1.0.15
# Severity: Informational (unmaintained)
# Date: 2024-10-07
#
# RATIONALE FOR ACCEPTANCE:
# paste is a procedural macro for token concatenation (e.g., paste! { [<foo _bar>] }).
# It is heavily used throughout the DataFusion/Lance/Candle ecosystems:
#   - datafusion-* (7 crates)
#   - lance-bitpacking
#   - gemm-* (matrix math, 12 crates)
#   - tokenizers (embeddings feature)
#
# RISK ASSESSMENT: VERY LOW
# 1. **Compile-time proc macro only** - no runtime code, zero security surface
# 2. **Mature, stable codebase** - feature-complete, no known bugs
# 3. **Core ecosystem dependency** - used by Apache DataFusion, Lance, Candle
# 4. **No viable alternative** - replacing would require forking entire ecosystems
#
# The paste crate is unmaintained but stable. Proc macros compile to nothing in
# the final binary (code generation only), so there's no runtime attack surface.
# The upstream ecosystems (DataFusion, Lance) will likely maintain a fork if
# critical issues arise.
#
# MITIGATION:
# - Monitor DataFusion/Lance releases for paste replacement
# - Accept risk as industry-standard practice (many projects use unmaintained paste)
# - No action required unless critical bug discovered (unlikely for mature proc macro)
#
# Documented in: RR12_DEPENDENCY_HYGIENE_ANALYSIS.md
# Accepted by: Claude (RR-12 Task #1 Cleanup, 2025-11-23)
# Expires: 2026-06-01 (re-evaluate with DataFusion/Lance ecosystem updates)

# ============================================================================
# RUSTSEC-2025-0040: users crate appends root to group listings
#
# Crate: users 0.11.0
# Severity: Low
# Date: 2025-01-15
#
# RATIONALE FOR ACCEPTANCE:
# users is pulled in by sqry-daemon for local Unix account metadata. sqry does
# not use group membership decisions as an authorization boundary, and the
# advisory has no fixed upgrade path. Failing release CI on an unfixable advisory
# blocks unrelated release repairs without reducing runtime exposure.
#
# MITIGATION:
# - Keep the audit exception explicit and time-boxed.
# - Re-evaluate if sqry-daemon starts enforcing authorization from Unix groups.
# - Remove this exception if users publishes a fixed version or is replaced.
#
# Accepted by: Codex release get-well, 2026-04-24
# Expires: 2026-07-24

[advisories]
ignore = [
    "RUSTSEC-2023-0071",  # rsa: Marvin Attack (not exploitable in sqry context)
    "RUSTSEC-2025-0119",  # number_prefix: unmaintained (low-risk formatting lib)
    "RUSTSEC-2024-0436",  # paste: unmaintained (compile-time proc macro, zero runtime risk)
    "RUSTSEC-2025-0040",  # users: group listing bug, no fixed upgrade path
]
