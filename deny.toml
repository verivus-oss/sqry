# sqry security policy (see docs/development/security-audit-automation/01_SPEC.md)
# RKG: implements REQ:SQRY-SECURITY-AUDIT-AUTOMATION

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Note: All vulnerability advisories now emit errors by default (cargo-deny v0.14+)
# To allow specific CVEs, add them to the ignore list below. Exceptions must
# also be documented in `.cargo/audit.toml` with rationale and expiry.
unmaintained = "workspace" # Keep failures scoped to direct dependencies until async-std is removed (RUSTSEC-2025-0052)
yanked = "warn"
# Ignore list = superset of `.cargo/audit.toml`'s ignore list.
# - The 4 IDs in .cargo/audit.toml (2023-0071 rsa, 2024-0436 paste,
#   2025-0040 users group-listing, 2025-0119 number_prefix) appear
#   here too with a "see audit.toml" pointer; audit.toml is the
#   canonical record (rationale + expiry).
# - RUSTSEC-2023-0040 and RUSTSEC-2023-0059 are deny-only entries for
#   `users` informational advisories; cargo-audit doesn't fail on them
#   under our settings, but cargo-deny would without these. Original
#   per-entry comments preserved verbatim below.
# 2026-05-07 reconciliation: added 2023-0071, 2024-0436, 2025-0119 to
# match audit.toml. No prior entry's rationale was rewritten.
ignore = [
  "RUSTSEC-2023-0040", # users: unmaintained, accepted with RUSTSEC-2025-0040 exception
  "RUSTSEC-2023-0059", # users: unsound advisory, no fixed upgrade path
  "RUSTSEC-2023-0071", # rsa: Marvin Attack (not exploitable in sqry context — see audit.toml)
  "RUSTSEC-2024-0436", # paste: unmaintained proc macro (zero runtime risk — see audit.toml)
  "RUSTSEC-2025-0040", # users: group listing bug, no fixed upgrade path
  "RUSTSEC-2025-0119", # number_prefix: unmaintained low-risk formatting lib (see audit.toml)
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "BSL-1.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "0BSD",
  "Unicode-3.0",
  "Zlib"
]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "simplest-path"
deny = [
  { crate = "async-std", reason = "Removed per RUSTSEC-2025-0052; sqry uses tokio-based async runtimes only." }
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = [
  "https://github.com/elixir-lang/tree-sitter-elixir",
  "https://github.com/fwcd/tree-sitter-kotlin",
  "https://github.com/tree-sitter-perl/tree-sitter-perl",
  # QA-2025-11-19: sqry-lang-sql depends on tree-sitter-sequel fork for PL/pgSQL support
  "https://github.com/verivus-oss/tree-sitter-sql"
]
