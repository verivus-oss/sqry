[package]
name = "sqry-nl"
description = "Natural language to sqry query translation layer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
exclude = ["training/**"]

[dependencies]
# Core dependencies from workspace
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
regex.workspace = true
lru.workspace = true
parking_lot.workspace = true
once_cell.workspace = true

# NL-specific dependencies
unicode-normalization = "0.1"
sha2 = "0.11"
# Platform-appropriate cache/config directory discovery (NL02 resolver).
dirs = "6.0"

# ONNX Runtime for inference (optional; enabled with the `classifier` feature)
# Exact-pin the known-good prerelease line until newer ort releases are validated
# against this workspace and local install flows.
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "ndarray", "load-dynamic"], optional = true }

# HuggingFace tokenizers (optional; enabled with the `classifier` feature)
# Version 0.21.4 matches Python tokenizers for tokenizer.json compatibility
tokenizers = { version = "0.23.1", optional = true }

# NL03 gated downloader stack — only pulled when `classifier` is enabled.
# - ureq: blocking HTTP client (no tokio); rustls keeps the build hermetic
#   and avoids pulling system OpenSSL.
# - flate2 / tar: streaming gzip + tar extraction for the verified archive.
ureq   = { version = "3.3", default-features = false, features = ["rustls"], optional = true }
flate2 = { version = "1.1",  optional = true }
tar    = { version = "0.4",  optional = true }

# NL07 classifier-pool concurrency primitives — only pulled when
# `classifier` is enabled. crossbeam-channel handles the bounded
# wait/notify atomically (no lost-wakeup risk), and scopeguard provides
# panic-safe slot return for the pool guard.
crossbeam-channel = { workspace = true, optional = true }
scopeguard = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3.27"
criterion = { version = "0.8", features = ["html_reports"] }
toml = "1.1"
flate2 = "1.1"
tar = "0.4"

# NL07 perf measurement — Linux-only, dev-only. Used by the
# concurrent-load test to assert per-classifier RSS delta stays within
# the NFR-2 envelope.
[target.'cfg(target_os = "linux")'.dev-dependencies]
procfs = "0.18"

[features]
default = []
# Enable the MiniLM-L6-v2 intent classifier (requires ONNX Runtime).
# Pulls in the NL03 gated downloader stack (ureq + flate2 + tar) — these
# are required because trusted-mode XDG cache hits are structurally
# auto-downloads (see classifier/download.rs trust-contract docs).
# Also pulls in the NL07 pool primitives (crossbeam-channel, scopeguard).
classifier = ["dep:ort", "dep:tokenizers", "dep:ureq", "dep:flate2", "dep:tar", "dep:crossbeam-channel", "dep:scopeguard"]

[[bench]]
name = "eval_harness"
harness = false
