# Golden Queries Test Suite for sqry-nl Intent Classification
#
# This file contains 120+ queries for evaluating the NL translation layer.
# Each query has:
#   - input: The natural language query
#   - expected_intent: The expected intent classification
#   - expected_command: Optional expected command pattern (flexible matching)
#   - difficulty: easy, medium, hard
#   - tags: Categories for filtering
#
# Command patterns use flexible matching:
#   - Substring matching for key terms (e.g., "query", "authenticate")
#   - Case-insensitive matching
#   - Regex patterns supported
#
# Targets:
#   - Intent accuracy: ≥95% (with trained model), ≥70% (rule-based)
#   - Command accuracy: ≥85% (with trained model), ≥60% (rule-based)

version = "1.0.0"
created = "2025-12-09"

