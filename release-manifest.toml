# release-manifest.toml — Single source of truth for OSS release sanitization
#
# Design: default-deny. Anything not explicitly listed as public is excluded.
# Both sanitize-for-oss.sh and validate-sanitization.sh read this file.
# CI enforces bidirectional set-equality between manifest and repo.
#
# Conventions:
#   - All paths are repo-relative
#   - Directories end with /
#   - Files are full repo-relative paths (no bare filenames except root_files)
#   - No glob patterns in selection (explicit listing only)

[manifest]
version = 4
default = "deny"

# ============================================================
# SELECTION POLICY — what survives sanitization
# ============================================================

# Workspace crates
# CI: set_eq(cargo_metadata_members, crates.public ∪ crates.excluded)
[selection.crates]
public = [
    # sqry core + CLI + servers (6)
    "sqry-cli/",
    "sqry-core/",
    "sqry-lsp/",
    "sqry-mcp/",
    "sqry-mcp-redaction/",
    "sqry-nl/",

    # Infrastructure (5)
    "sqry-lang-support/",
    "sqry-plugin-registry/",
    "sqry-test-fixtures/",
    "sqry-test-support/",
    "sqry-tree-sitter-fuzz-support/",
    "sqry-tree-sitter-support/",

    # Language plugins (35)
    "sqry-lang-c/",
    "sqry-lang-cpp/",
    "sqry-lang-csharp/",
    "sqry-lang-css/",
    "sqry-lang-dart/",
    "sqry-lang-elixir/",
    "sqry-lang-go/",
    "sqry-lang-groovy/",
    "sqry-lang-haskell/",
    "sqry-lang-html/",
    "sqry-lang-java/",
    "sqry-lang-javascript/",
    "sqry-lang-kotlin/",
    "sqry-lang-lua/",
    "sqry-lang-oracle-plsql/",
    "sqry-lang-perl/",
    "sqry-lang-php/",
    "sqry-lang-pulumi/",
    "sqry-lang-puppet/",
    "sqry-lang-python/",
    "sqry-lang-r/",
    "sqry-lang-ruby/",
    "sqry-lang-rust/",
    "sqry-lang-salesforce-apex/",
    "sqry-lang-sap-abap/",
    "sqry-lang-scala/",
    "sqry-lang-servicenow-xanadu/",
    "sqry-lang-shell/",
    "sqry-lang-sql/",
    "sqry-lang-svelte/",
    "sqry-lang-swift/",
    "sqry-lang-terraform/",
    "sqry-lang-typescript/",
    "sqry-lang-vue/",
    "sqry-lang-zig/",

    # Vendored tree-sitter grammars (8)
    "crates/tree-sitter-abap-sqry/",
    "crates/tree-sitter-elixir-sqry/",
    "crates/tree-sitter-groovy-sqry/",
    "crates/tree-sitter-kotlin-sqry/",
