    ".github/workflows/benchmark-pr.yml",
    ".github/workflows/bench-smoke.yml",
    ".github/workflows/compression-gates.yml",
    ".github/workflows/core-nightly.yml",
    ".github/workflows/coverage.yml",
    ".github/workflows/fuzz-all-buildjet.yml",
    ".github/workflows/fuzz-extended-buildjet.yml",
    ".github/workflows/fuzz-extended-onetime.yml",
    ".github/workflows/fuzz-mcp-lsp.yml",
