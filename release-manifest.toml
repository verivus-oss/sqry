    ".github/workflows/publish-mcp-registry.yml",
    ".github/workflows/release-signing.yml",
    ".github/workflows/security-quarterly-audit.yml",
    ".github/workflows/signing-smoke.yml",
    ".github/workflows/temp-ci-auto-rebuild.yml",
    ".github/workflows/temp-ci-lock-race.yml",
    ".github/workflows/test-action.yml",
    ".github/workflows/website.yml",
