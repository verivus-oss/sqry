# tools/ — each immediate child classified
# CI: set_eq(ls tools/*/, tools.public ∪ tools.excluded)
[selection.tools]
public = []  # Empty after sqry-vscode promotion to top-level
excluded = [
    "tools/detection-corpus-validator/",
    "tools/graphsync/",
    "tools/naming-audit/",
    "tools/slopscan/",
    "tools/sonarqube/",
    "tools/tests/",
]

# docs/ — default-deny scope
# CI: every file in sanitized docs/ must be in files_public or under dirs_public
[selection.docs]
files_public = ["docs/FEATURE_LIST.md", "docs/SCHEMA.md"]
dirs_public = ["docs/user-guide/"]

# Non-crate top-level directories
[selection.dirs]
public = [
    "crates/",
    "third-party/",
    "test-fixtures/",
    "tests/",
    "vendor/",
    "assets/",
    "supply-chain/",
    ".openvex/",
    "sqry-vscode/",  # Promoted from tools/
]

# scripts/ — default-deny scope
# CI: every file in sanitized scripts/ must be in scripts.public
[selection.scripts]
public = [
    "scripts/install.sh",
    "scripts/install.ps1",
    "scripts/sync-versions.sh",
    "scripts/release/check-workflow-contracts.sh",
    "scripts/release/render-distribution-configs.sh",
]

# Root files (depth-0 tracked files only, excluding dotfile directories)
# CI: set_eq(git ls-files --cached | grep -v /, root_files.public ∪ root_files.excluded)
[selection.root_files]
public = [
