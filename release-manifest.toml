[sanitization.forbidden_patterns]
strings = []
path_patterns = [
    ".claude/",
    ".codex",
    "AGENTS.md",
    "CLAUDE.md",
    "CODEX.md",
    "docs/development/",
    "docs/reviews/",
    "docs/agent-process/",
]

[packaging]
allowed_extensions = [
    ".rs", ".toml", ".lock", ".md", ".txt", ".yml", ".yaml",
    ".json", ".js", ".cjs", ".ts", ".py", ".dart", ".go", ".java", ".swift", ".sql",
    ".css", ".html", ".sh", ".ps1", ".c", ".h", ".cc", ".hh", ".cpp", ".cs",
    ".kt", ".php", ".rb", ".scala", ".zig", ".abap", ".cls", ".scm",
    ".R", ".ex", ".groovy", ".hs", ".lua", ".pkb", ".pl", ".pp", ".svelte", ".tf",
    ".vue", ".xml",
]
allowed_dotfiles = [".gitignore", ".gitattributes", ".cargo", ".editorconfig", ".vscodeignore"]
	allowed_basenames = [
    "Dockerfile",
    "Containerfile",
    "LICENSE",
    "LICENSE-*",
    "COPYING",
    "COPYING.*",
    "NOTICE",
    "NOTICE.*",
    "AUTHORS",
    "AUTHORS.*",
	    "VERSION",
	    "BUILD",
	    "WORKSPACE",
	    "build.gradle",
	    "settings.gradle",
	    "build.gradle.kts",
	    "build.sbt",
	    "pom.xml",
	]
binary_assets = [
    "assets/*.png",
    "assets/*.svg",
    "sqry-vscode/media/*.png",
    "sqry-vscode/media/*.svg",
    "sqry-vscode/resources/*.png",
]

