    "tools/detection-corpus-validator/",
    "tools/graphsync/",
    "tools/naming-audit/",
    "tools/slopscan/",
    "benchmarks/",
]

# .cargo/ files
# CI: set_eq(ls .cargo/*, cargo.public)
[selection.cargo]
public = [".cargo/config.toml", ".cargo/audit.toml"]

# .github/ — full accounting
# CI: set_eq(ls .github/workflows/*.yml, workflows_public ∪ workflows_excluded)
# CI: set_eq(immediate children of .github/ excl workflows/, configs_public ∪ configs_excluded)
[selection.github]
