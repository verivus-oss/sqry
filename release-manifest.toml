# ============================================================
# REWRITE POLICY — org reference transformation rules
# Used by sanitize-for-oss.sh (Phase 8) and oss-leg2-publish.yml
# ============================================================

[rewrite]
# Files completely exempt from ALL org-name rewriting.
# These contain canonical references (Azure OIDC subjects, KV names,
# grep validation patterns) that must not be transformed.
exempt_paths = [
    ".github/workflows/oss-leg3-release.yml",
    ".github/workflows/publish-crates.yml",
]

# Files that legitimately reference the public org (verivus-oss) even
# in the staging tree. The sanitizer's "wrong-target org" scan skips these.
public_org_in_staging = [
    ".github/workflows/oss-leg3-release.yml",
    ".github/workflows/publish-crates.yml",
    "scripts/install.sh",
    "scripts/install.ps1",
    "scripts/sync-versions.sh",
    "scripts/release/render-distribution-configs.sh",
]

# Org replacement rules applied in order during sanitization.
# Each rule: source pattern -> replacement, with file scope.
[[rewrite.rules]]
description = "GitHub repo URLs"
pattern = "verivus-oss/sqry"
replacement = "verivus-oss/sqry"
file_types = ["*.rs", "*.md", "*.toml", "*.yml", "*.yaml", "*.json", "*.sh", "*.properties"]

[[rewrite.rules]]
description = "GitHub Pages URLs"
pattern = "verivus-oss.github.io"
replacement = "verivus-oss.github.io"
file_types = ["*.md", "*.html"]

[[rewrite.rules]]
description = "OCI registry"
pattern = "ghcr.io/verivus-oss/"
replacement = "ghcr.io/verivus-oss/"
file_types = ["*.yml", "*.yaml", "*.json", "*.md"]

[[rewrite.rules]]
description = "Bare org name (catch-all, runs last)"
pattern = "verivus-oss"
replacement = "verivus-oss"
file_types = ["*.rs", "*.md", "*.toml", "*.yml", "*.yaml", "*.json", "*.sh", "*.properties"]

# Email normalization (separate from org rewrite)
[[rewrite.email_rules]]
pattern = ""
replacement = ""
file_types = ["*.rs", "*.md", "*.toml"]

[[rewrite.email_rules]]
pattern = ""
replacement = "hello@sqry.dev"
file_types = ["*.rs", "*.md", "*.toml"]

[[rewrite.email_rules]]
pattern = ""
replacement = ""
file_types = ["*.rs", "*.md", "*.toml"]

# Internal comment markers to strip
[rewrite.strip_markers]
rust = ["// INTERNAL:", "// PROPRIETARY:", "// VERIVUS INTERNAL"]
markdown = ["<!-- INTERNAL -->", "<!-- /INTERNAL -->", "<!-- PROPRIETARY -->", "<!-- /PROPRIETARY -->"]

# ============================================================
# PACKAGING POLICY — secondary defense-in-depth for tarball
# These do NOT drive publication (selection does).
# These reject unexpected file types within already-public paths.
# ============================================================

[packaging]
# Allowed source/config extensions in the tarball.
# Files in public paths with unlisted extensions are rejected.
allowed_extensions = [
    # Rust
    ".rs",
    # Build / config
    ".toml", ".lock", ".yml", ".yaml", ".json", ".jsonl",
    # Documentation
    ".md", ".txt",
    # C / C++ (tree-sitter grammars)
    ".c", ".h", ".cc",
    # Tree-sitter queries
    ".scm",
    # Web (sqry-vscode)
    ".ts", ".js", ".css", ".html", ".svg",
    # Shell / scripts
    ".sh", ".ps1", ".bat",
    # Test fixtures — language source files
    ".py", ".rb", ".go", ".java", ".kt", ".scala", ".swift",
    ".php", ".pl", ".pm", ".r", ".lua", ".zig", ".hs",
    ".ex", ".exs", ".erl", ".lhs",
    ".R", ".Rmd",
    ".cs", ".fs",
    ".dart", ".groovy", ".gradle",
    ".tf", ".hcl",
    ".sql", ".plsql",
    ".cls", ".trigger", ".apex",
    ".abap",
    ".vue", ".svelte",
    ".cpp", ".cxx", ".hpp",
    ".m", ".mm",
    # Test snapshot / CLI integration
    ".snap", ".trycmd",
    ".stderr", ".stdout",
    # Emacs Lisp (vendor grammars)
    ".el",
    # Config / data
    ".xml", ".xsl", ".xsd", ".dtd",
    ".ini", ".cfg", ".conf",
    ".editorconfig",
    ".csv",
    # AI / ML models
    ".onnx",
    # SBOM / VEX
    ".cdx", ".vex",
    # Puppet
    ".pp",
    # Docker
    ".dockerfile",
    # Makefile (no extension — handled by name, not here)
]

# Dotfiles allowed in tarball
allowed_dotfiles = [
    ".gitignore",
    ".gitattributes",
    ".dockerignore",
    ".vscodeignore",
    ".npmignore",
    ".prettierrc",
]

# Binary assets explicitly staged (not covered by extension guard)
# Glob patterns relative to repo root.
binary_assets = [
    "sqry-vscode/media/*.png",
    "assets/*.png",
    "assets/*.svg",
    "sqry-nl/models/*.onnx",
]

# Named release artifacts (built by Leg 3, not in source tree)
# {VERSION} is replaced with the bare version (e.g., 4.11.0)
[packaging.release_artifacts]
include = [
    "sqry-{VERSION}-linux-x86_64.tar.gz",
    "sqry-{VERSION}-linux-arm64.tar.gz",
    "sqry-{VERSION}-macos-arm64.tar.gz",
    "sqry-{VERSION}-windows-x86_64.msi",
    "sqry-{VERSION}-windows-x86_64.zip",
    "sqry-{VERSION}-macos-arm64.pkg",
    "sqry_{VERSION}_amd64.deb",
    "sqry_{VERSION}_arm64.deb",
    "sqry-{VERSION}-1.x86_64.rpm",
    "sqry-{VERSION}-1.aarch64.rpm",
    "sqry-vscode-{VERSION}.vsix",
]

# ============================================================
# SCANNING POLICY — secret/leak detection
# Each exception: path, line_pattern, detector, justification, owner, expires
# ============================================================

[scanning.secret_exceptions]

[[scanning.secret_exceptions.entries]]
path = "sqry-cli/src/persistence/history.rs"
line_pattern = "AKIA.*TEST"
detector = "gitleaks:aws-access-key-id"
justification = "Fake test credentials for history encryption unit tests"
owner = "sqry-cli"
expires = "2027-01-01"

[[scanning.secret_exceptions.entries]]
path = "sqry-nl/models/checksums.json"
line_pattern = "[a-f0-9]{64}"
detector = "gitleaks:generic-api-key"
justification = "SHA256 model checksums, not secrets"
owner = "sqry-nl"
expires = "2027-01-01"
