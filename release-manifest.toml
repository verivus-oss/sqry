# release-manifest.toml — Single source of truth for OSS release sanitization
#
# Design: default-deny. Anything not explicitly listed as public is excluded.
# sanitize-for-oss.sh and verify-sanitized-tree.sh read this file.

[manifest]
version = 6
default = "deny"

[selection.crates]
public = [
    "sqry-classpath/",
    "sqry-cli/",
    "sqry-core/",
    "sqry-daemon/",
    "sqry-daemon-client/",
    "sqry-daemon-protocol/",
    "sqry-db/",
    "sqry-lsp/",
    "sqry-mcp/",
    "sqry-mcp-redaction/",
    "sqry-lang-support/",
    "sqry-plugin-registry/",
    "sqry-rules/",
    "sqry-tree-sitter-support/",
    "sqry-lang-c/",
    "sqry-lang-cpp/",
    "sqry-lang-csharp/",
    "sqry-lang-css/",
    "sqry-lang-dart/",
    "sqry-lang-elixir/",
    "sqry-lang-go/",
    "sqry-lang-groovy/",
    "sqry-lang-haskell/",
    "sqry-lang-html/",
    "sqry-lang-java/",
    "sqry-lang-javascript/",
    "sqry-lang-json/",
    "sqry-lang-kotlin/",
    "sqry-lang-lua/",
    "sqry-lang-oracle-plsql/",
    "sqry-lang-perl/",
    "sqry-lang-php/",
    "sqry-lang-pulumi/",
    "sqry-lang-puppet/",
    "sqry-lang-python/",
    "sqry-lang-r/",
    "sqry-lang-ruby/",
    "sqry-lang-rust/",
    "sqry-lang-salesforce-apex/",
    "sqry-lang-sap-abap/",
    "sqry-lang-scala/",
    "sqry-lang-servicenow-xanadu/",
    "sqry-lang-servicenow-xml/",
    "sqry-lang-shell/",
    "sqry-lang-sql/",
    "sqry-lang-svelte/",
    "sqry-lang-swift/",
    "sqry-lang-terraform/",
    "sqry-lang-typescript/",
    "sqry-lang-vue/",
    "sqry-lang-zig/",
    "crates/tree-sitter-abap-sqry/",
    "crates/tree-sitter-elixir-sqry/",
    "crates/tree-sitter-groovy-sqry/",
    "crates/tree-sitter-kotlin-sqry/",
    "crates/tree-sitter-perl-sqry/",
    "crates/tree-sitter-plsql-sqry/",
    "crates/tree-sitter-svelte-sqry/",
    "crates/tree-sitter-vue-sqry/",
]
excluded = [
    "tools/",
    "benchmarks/",
    "sqry-test-support/",
    "sqry-test-fixtures/",
    "sqry-tree-sitter-fuzz-support/",
]

[selection.root_files]
public = [
    ".gitattributes",
    ".gitignore",
    "Cargo.lock",
    "Cargo.toml",
    "CHANGELOG.md",
    "clippy.toml",
    "CONTRIBUTING.md",
    "deny.toml",
    "ERRATA.md",
    # Glama MCP-directory maintainer file. Ships to the public mirror so Glama
    # can verify org ownership and build the packaging/docker/Dockerfile.
    "glama.json",
    "LICENSE",
    "QUICKSTART.md",
    "README.md",
    "release-manifest.toml",
    "rust-toolchain.toml",
    "rustfmt.toml",
    "THIRD-PARTY-LICENSES",
    "TRADEMARK.md",
]
excluded = [
    "CLAUDE.md",
    "AGENTS.md",
    "CODEX.md",
    "action.yml",
    ".codexignore",
    ".dockerignore",
    ".env.test",
]

[selection.cargo]
public = [".cargo/config.toml", ".cargo/audit.toml", ".cargo/mutants.toml"]

[selection.workflows]
# GitHub Actions workflows tracked as part of the OSS surface contract.
# Workflows in `public` ship to the OSS mirror; release/distribution
# workflows are managed separately via scripts/release/managed-paths/.
public = [
    # STEP_11 (workspace-aware-cross-repo) — six-gate CI workflow.
    # Referenced by branch-protection on master.
    ".github/workflows/ci.yml",
    # Homebrew formula publisher. Runs in verivus-oss/sqry and pushes the
    # rendered formula to verivus-oss/homebrew-sqry on every release.
    ".github/workflows/publish-homebrew-tap.yml",
    # P0 #1 of docs/reviews/test-strategy-audit-2026-04-30/CATALOGUE.md.
    # cargo-mutants gate (PR changed-lines + master baseline rotation).
    # Strategy ref: docs/reviews/test-strategy-audit-2026-04-30/CATALOGUE.md §2.4, §7.1 #7.
    ".github/workflows/mutation-gate.yml",
    # U_WS1_13_FUZZ: nightly cargo-fuzz target on sqry-db planner::parse.
    # Nightly-only (schedule + workflow_dispatch); not triggered on PRs.
    ".github/workflows/fuzz-parse.yml",
]

[selection.docs]
files_public = [
    "docs/claim-traceability.toml",
    "docs/FEATURE_LIST.md",
    "docs/SCHEMA.md",
    "docs/SEMANTIC_VERSIONING.md",
    "docs/release/homebrew-tap.md",
    "docs/superpowers/plans/2026-03-19-sqryd-daemon.md",
]
dirs_public = ["docs/user-guide/"]

[selection.scripts]
public = [
    "scripts/install.sh",
    "scripts/install.ps1",
    "scripts/release/render-homebrew-formula.sh",
    "scripts/sync-versions.sh",
    # MCP-registry publisher. Runs in verivus-oss/sqry (publish-container.yml,
    # on release: published) to register io.github.verivus-oss/sqry via OIDC.
    "scripts/release/register-mcp-registry.sh",
    # STEP_11 (workspace-aware-cross-repo) CI gate scripts. These run in
    # .github/workflows/ci.yml and are referenced by branch-protection.
    "scripts/ci/check_claim_traceability.sh",
    "scripts/ci/check_routing_gates.sh",
    "scripts/ci/check_vscode_settings_parity.sh",
    # STEP_8 reproduction harness for the operational-folder regression
    # (zero member/excluded `No index found` lines).
    "scripts/repro/operational_folder.sh",
    # mutation-gate.yml summary renderer. Reads cargo-mutants outcomes.json
    # and emits Markdown into GITHUB_STEP_SUMMARY.
    "scripts/ci/mutants_summary.py",
    # Phase A C indirect-call precision: build-time perf gate enforcing
    # SPEC §5.2's +15% SAME-COMMIT MARGINAL budget on the linux-driver-subset
    # fixture (2026-07-06 remethodology, verivus-oss/sqry#280; drives the
    # paired-alternating `sqry-lang-c/examples/phase_a_marginal` binary rather
    # than a frozen absolute baseline), and a fan-out histogram tool consuming
    # `cargo run --example measure_indirect_fanout` output for cap calibration.
    "scripts/measure/VERSION",
    "scripts/measure/check_phase_a_perf_gate.sh",
    "scripts/measure/icall_fanout_histogram.py",
]

[selection.packaging]
# Homebrew formula template — consumed by scripts/release/render-homebrew-formula.sh
# during the publish-homebrew-tap workflow. Must ship to the OSS repo so the
# workflow can render against it.
public = [
    "packaging/homebrew/sqry.rb",
    # sqry-mcp container image (alpine + git, static musl binary). Ships public
    # so the Glama build check and the release pipeline can build it from the
    # mirror.
    "packaging/docker/Dockerfile",
    "packaging/podman/Containerfile",
]

[selection.dirs]
public = [
    "crates/",
    "third-party/",
    "test-fixtures/",
    "tests/",
    "vendor/",
    "assets/",
    "supply-chain/",
    ".openvex/",
    "sqry-vscode/",
]

