[package]
name = "sqry-lang-svelte"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Svelte language plugin for sqry"

[dependencies]
sqry-core = { version = "6.0.22", path = "../sqry-core" }
anyhow.workspace = true
tree-sitter.workspace = true
tree-sitter-svelte-sqry = { version = "6.0.22", path = "../crates/tree-sitter-svelte-sqry" }
tree-sitter-javascript.workspace = true
tree-sitter-typescript.workspace = true
streaming-iterator.workspace = true
sqry-lang-support = { version = "6.0.22", path = "../sqry-lang-support" }
sqry-lang-javascript = { version = "6.0.22", path = "../sqry-lang-javascript" }
sqry-lang-typescript = { version = "6.0.22", path = "../sqry-lang-typescript" }
regex.workspace = true

[dev-dependencies]
log.workspace = true
sqry-core = { path = "../sqry-core", features = ["test-support"] }
serde.workspace = true
serde_json.workspace = true
insta = { version = "1.39", features = ["yaml"] }
