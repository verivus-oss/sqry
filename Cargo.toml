exclude = [
    "tools/detection-corpus-validator",  # Standalone utility, not part of workspace
    "tools/graphsync",  # Standalone tool, excluded due to serde-saphyr/smallvec conflict with ort
    "tools/naming-audit",  # Internal-only development tool, not shipped with sqry
    "tools/slopscan",  # Internal-only development tool, not shipped with sqry
    "sqry-openai",  # Archived Python integration, not default product surface
    "sqry-nl/training",  # Archived NL model training pipeline
    "sqry-nl/models",  # Archived NL model metadata/artifacts
]

[workspace.package]
version = "19.0.2"
edition = "2024"
authors = ["Verivus Pty Ltd"]
license = "MIT"
repository = "https://github.com/verivus-oss/sqry"
homepage = "https://sqry.dev"
rust-version = "1.94"  # MINIMUM: Rust 1.94+ Edition 2024 required

# Workspace-wide lint configuration
[workspace.lints.rust]
# Allow `#[cfg(disabled)]` for temporarily disabling tests/code
# Allow `#[cfg(fuzzing)]` for cargo-fuzz targets.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(disabled)', 'cfg(fuzzing)'] }

[workspace.dependencies]
# Core dependencies
anyhow = "1.0"
thiserror = "2.0"
miette = { version = "7.6", features = ["fancy"] }
tree-sitter = "0.26"
# Note: tree-sitter 0.26 supports both ABI 14 (0.23.x grammars) and ABI 15 (1.x grammars)

# CLI dependencies
clap = { version = "4.6", features = ["derive", "env"] }
colored = "3.1"

# Task 9 U15a — Linux-only deps for sqry-daemon lifecycle.
# sd-notify: sends READY=1/STATUS=/STOPPING=1 to systemd on Type=notify units.
sd-notify = "0.5"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }  # rc enables Arc serialization
serde_json = "1.0"
serde_bytes = "0.11"  # Efficient byte slice serialization (P2-8 warm images)
toml = "1.1"  # TOML parsing for config files (FR-2025-016 Phase 3.2)
postcard = { version = "1", default-features = false, features = ["use-std", "alloc"] }
hex = "0.4"  # Hex encoding/decoding for hash representations

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Regex
regex = "1.12"
fancy-regex = "0.18"  # Supports lookahead/lookbehind (FT-C.1)

# Fuzzy string matching
rapidfuzz = "0.5"

# Search & file handling
grep = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
globset = "0.4"
walkdir = "2.5"
tempfile = "3.27"

# Caching & performance
lru = "0.18"
dashmap = "6.2.1"
memmap2 = "0.9"
parking_lot = "0.12"
smallvec = "1.15"
semver = "1.0"
blake3 = "1.8"  # Fast cryptographic hashing for cache keys
zstd = "0.13.3"   # Fast compression for index files (pinned for reproducibility)
cacache = { version = "13", default-features = false, features = ["mmap", "tokio-runtime"] }

# Parallel processing
rayon = "1.12"
crossbeam-queue = "0.3"
crossbeam-channel = "0.5"

# Lazy static initialization
once_cell = "1.21"
sha2 = "0.11"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
cafebabe = { version = "0.9", features = ["threadsafe"] }  # JVM .class file parser (Track C)


# Logging
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "regex"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "signal", "net", "io-std", "io-util", "time"] }
tower-lsp = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Streaming iterator (used by tree-sitter)
streaming-iterator = "0.1"

# Tree-sitter language grammars (pinned versions - adjusted for compatibility)
# Note: All grammars using 0.23.x for tree-sitter 0.24 compatibility
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.23.1"  # Updated from 0.21.4 due to cc dependency conflict
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.23.6"     # Updated from 0.21.0 for consistency
tree-sitter-go = "0.23.4"
tree-sitter-java = "0.23.5"       # Java language support (Tier 1 priority)
tree-sitter-c = "0.23.4"          # C language support (Tier 1 priority)
tree-sitter-cpp = "0.23.4"        # C++ language support (Tier 1 priority)
tree-sitter-c-sharp = "0.23.5"    # C# language support (Tier 1 priority)
tree-sitter-php = "0.24.2"        # PHP language support (Phase 2 priority)
tree-sitter-sequel = "0.3.11"     # SQL language support (PL/pgSQL)
# tree-sitter-kotlin: vendored as crates/tree-sitter-kotlin-sqry
tree-sitter-lua = "0.2.0"                # Lua language support (Phase 1 Tier 2)
tree-sitter-ruby = "0.23.1"       # Ruby language support (Phase 1 Tier 2)
tree-sitter-swift = "0.7.2"       # Swift language support (Phase 1 Tier 2)
tree-sitter-scala = "0.25.1"      # Scala language support (Phase 1 Tier 2)
tree-sitter-r = "1.2.0"           # R language support (Phase 1 Tier 2)
tree-sitter-hcl = "1.1.0"
tree-sitter-puppet = "1.3.0"
tree-sitter-yaml = "0.6.1"
tree-sitter-json = "0.23.0"
tree-sitter-bash = "0.23.3"
# tree-sitter-elixir: vendored as crates/tree-sitter-elixir-sqry
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.23.2"
tree-sitter-haskell = "0.23.1"
# tree-sitter-perl: vendored as crates/tree-sitter-perl-sqry
tree-sitter-zig = "1.1.2"         # Zig language support (Phase 2 Tier 2)

[patch.crates-io]
ssri = { path = "third-party/ssri" }
lsp-types = { path = "third-party/lsp-types" }
kqueue-sys = { path = "third-party/kqueue-sys" }
tower-lsp = { path = "third-party/tower-lsp" }
jobserver = { path = "third-party/jobserver" }

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
debug = false
opt-level = 3
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
inherits = "release"
