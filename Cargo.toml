]
default-members = [
    "sqry-core",
    "sqry-cli",
    "sqry-mcp",
    "sqry-lang-rust",
    "sqry-lang-javascript",
    "sqry-lang-typescript",
    "sqry-lang-python",
    "sqry-lang-go",
    "sqry-lang-java",
    "sqry-lang-c",
    "sqry-lang-cpp",
    "sqry-lang-csharp",
    "sqry-lang-php",
    "sqry-lang-sql",
    "sqry-lang-kotlin",
    "sqry-lang-lua",
    "sqry-lang-ruby",
    "sqry-lang-swift",
    "sqry-lang-scala",
    "sqry-lang-elixir",
    "sqry-lang-r",
    "sqry-lang-dart",
    "sqry-lang-shell",
