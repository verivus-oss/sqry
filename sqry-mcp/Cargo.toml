[package]
name = "sqry-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MCP server for sqry semantic code search"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(disabled)', 'cfg(fuzzing)'] }

[lib]
name = "sqry_mcp"
path = "src/lib.rs"

[[bin]]
name = "sqry-mcp"
path = "src/main.rs"

[features]
default = []
# Enable MiniLM-L6-v2 ONNX intent classifier for sqry_ask (adds ~57MB, requires ONNX Runtime)
nl-classifier = ["sqry-nl/classifier"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
sqry-core = { version = "4.10.0", path = "../sqry-core" }
sqry-plugin-registry = { version = "4.10.0", path = "../sqry-plugin-registry" }
sqry-nl = { version = "4.10.0", path = "../sqry-nl", default-features = false }
sqry-mcp-redaction = { version = "4.10.0", path = "../sqry-mcp-redaction" }

# MCP SDK for protocol compliance
rmcp = { version = "0.16", features = ["server", "transport-io"] }

# JSON schema derivation for parameter types (must match rmcp's version)
schemars = "1"
parking_lot.workspace = true
once_cell = "1.19"
hdrhistogram = { version = "7.5", default-features = false, features = ["sync"] }
url = "2.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2.workspace = true
hex.workspace = true
base64 = "0.22"
tempfile = "3.27"
strsim = "0.11"
indexmap = "2"
rayon.workspace = true
lru = "0.16"

[target.'cfg(target_env = "musl")'.dependencies]
tikv-jemallocator = "0.6"
tikv-jemalloc-sys = { version = "0.6", features = ["unprefixed_malloc_on_supported_platforms"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27"
log.workspace = true
serial_test = "3.0"
criterion = { version = "0.8", features = ["html_reports"] }
approx = "0.5"
walkdir = "2"
sqry-lang-rust = { path = "../sqry-lang-rust" }
