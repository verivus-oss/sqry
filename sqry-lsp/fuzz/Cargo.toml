[workspace]

[package]
name = "sqry-lsp-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"

[dependencies.sqry-lsp]
path = ".."

[[bin]]
name = "lsp_position_conversion"
path = "fuzz_targets/lsp_position_conversion.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lsp_protocol_parse"
path = "fuzz_targets/lsp_protocol_parse.rs"
test = false
doc = false
bench = false
