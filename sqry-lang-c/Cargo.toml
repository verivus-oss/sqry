[package]
name = "sqry-lang-c"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "C language plugin for sqry"

[dependencies]
sqry-core = { version = "29.0.2", path = "../sqry-core" }
anyhow.workspace = true
tree-sitter.workspace = true
tree-sitter-c.workspace = true
streaming-iterator.workspace = true

[dev-dependencies]
log.workspace = true
sqry-core = { path = "../sqry-core", features = ["test-support"] }
tempfile = "3.27"
serial_test = "3.4"
criterion = { version = "0.8", features = ["html_reports"] }

[features]
default = ["has_relations"]
has_relations = []
# Test/bench-only. Exposes `CPlugin::without_phase_a` / the matching
# `CGraphBuilder::without_phase_a` constructor so the c_indirect bench and the
# phase_a_marginal example can build the fixture with Phase A disabled.
# `scripts/measure/check_phase_a_perf_gate.sh` runs
# `cargo run --release --example phase_a_marginal --features phase-a-toggle`
# (a paired, alternating same-commit measurement, not a criterion bench) to
# measure the marginal build-time cost. Never enabled by production builds.
phase-a-toggle = []

[[bench]]
name = "c_indirect"
harness = false
