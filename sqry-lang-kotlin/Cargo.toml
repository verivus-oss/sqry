[package]
name = "sqry-lang-kotlin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Kotlin language plugin for sqry"

[dependencies]
sqry-core = { version = "18.0.2", path = "../sqry-core" }
sqry-lang-support = { version = "18.0.2", path = "../sqry-lang-support" }
anyhow.workspace = true
log.workspace = true
tree-sitter.workspace = true
tree-sitter-kotlin-sqry = { version = "18.0.2", path = "../crates/tree-sitter-kotlin-sqry" }
streaming-iterator.workspace = true

[dev-dependencies]
env_logger.workspace = true
sqry-core = { path = "../sqry-core", features = ["test-support"] }
tempfile = "3.27"

[features]
default = ["has_relations"]
has_relations = []
