[package]
name = "sqry-lang-kotlin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Kotlin language plugin for sqry"

[dependencies]
sqry-core = { path = "../sqry-core" }
sqry-lang-support = { path = "../sqry-lang-support" }
anyhow.workspace = true
log.workspace = true
tree-sitter.workspace = true
tree-sitter-kotlin.workspace = true
streaming-iterator.workspace = true

[dev-dependencies]
sqry-tree-sitter-fuzz-support = { path = "../sqry-tree-sitter-fuzz-support" }
env_logger.workspace = true
sqry-core = { path = "../sqry-core", features = ["test-support"] }
tempfile = "3.10"

[features]
default = ["has_relations"]
has_relations = []
