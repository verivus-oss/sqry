[package]
name = "sqry-lang-groovy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Groovy language plugin for sqry"

[dependencies]
sqry-core = { version = "9.0.22", path = "../sqry-core" }
anyhow.workspace = true
tree-sitter.workspace = true
tree-sitter-groovy-sqry = { version = "9.0.22", path = "../crates/tree-sitter-groovy-sqry" }
streaming-iterator.workspace = true
sqry-lang-support = { version = "9.0.22", path = "../sqry-lang-support" }

[dev-dependencies]
log.workspace = true
sqry-core = { path = "../sqry-core", features = ["test-support"] }
serde.workspace = true
serde_json.workspace = true
insta = { version = "1.47", features = ["yaml"] }

[features]
default = ["has_relations"]
has_relations = []
