[package]
name = "sqry-plugin-registry"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Plugin registry for sqry language plugins"

[dependencies]
sqry-core = { version = "32.0.1", path = "../sqry-core" }
sqry-lang-rust = { version = "32.0.1", path = "../sqry-lang-rust" }
sqry-lang-javascript = { version = "32.0.1", path = "../sqry-lang-javascript" }
sqry-lang-java = { version = "32.0.1", path = "../sqry-lang-java" }
sqry-lang-typescript = { version = "32.0.1", path = "../sqry-lang-typescript" }
sqry-lang-python = { version = "32.0.1", path = "../sqry-lang-python" }
sqry-lang-go = { version = "32.0.1", path = "../sqry-lang-go" }
sqry-lang-lua = { version = "32.0.1", path = "../sqry-lang-lua" }
sqry-lang-r = { version = "32.0.1", path = "../sqry-lang-r" }
sqry-lang-dart = { version = "32.0.1", path = "../sqry-lang-dart" }
sqry-lang-sql = { version = "32.0.1", path = "../sqry-lang-sql" }
sqry-lang-swift = { version = "32.0.1", path = "../sqry-lang-swift" }
sqry-lang-c = { version = "32.0.1", path = "../sqry-lang-c" }
sqry-lang-cpp = { version = "32.0.1", path = "../sqry-lang-cpp" }
sqry-lang-csharp = { version = "32.0.1", path = "../sqry-lang-csharp" }
sqry-lang-kotlin = { version = "32.0.1", path = "../sqry-lang-kotlin" }
sqry-lang-ruby = { version = "32.0.1", path = "../sqry-lang-ruby" }
sqry-lang-php = { version = "32.0.1", path = "../sqry-lang-php" }
sqry-lang-scala = { version = "32.0.1", path = "../sqry-lang-scala" }
sqry-lang-shell = { version = "32.0.1", path = "../sqry-lang-shell" }
sqry-lang-html = { version = "32.0.1", path = "../sqry-lang-html" }
sqry-lang-css = { version = "32.0.1", path = "../sqry-lang-css" }
sqry-lang-haskell = { version = "32.0.1", path = "../sqry-lang-haskell" }
sqry-lang-perl = { version = "32.0.1", path = "../sqry-lang-perl" }
sqry-lang-elixir = { version = "32.0.1", path = "../sqry-lang-elixir" }
sqry-lang-vue = { version = "32.0.1", path = "../sqry-lang-vue" }
sqry-lang-svelte = { version = "32.0.1", path = "../sqry-lang-svelte" }
sqry-lang-groovy = { version = "32.0.1", path = "../sqry-lang-groovy" }
sqry-lang-zig = { version = "32.0.1", path = "../sqry-lang-zig" }
sqry-lang-json = { version = "32.0.1", path = "../sqry-lang-json" }
sqry-lang-oracle-plsql = { version = "32.0.1", path = "../sqry-lang-oracle-plsql" }
sqry-lang-salesforce-apex = { version = "32.0.1", path = "../sqry-lang-salesforce-apex", optional = true }
sqry-lang-sap-abap = { version = "32.0.1", path = "../sqry-lang-sap-abap", optional = true }
sqry-lang-servicenow-xanadu = { version = "32.0.1", path = "../sqry-lang-servicenow-xanadu", optional = true }
sqry-lang-servicenow-xml = { version = "32.0.1", path = "../sqry-lang-servicenow-xml", optional = true }
sqry-lang-terraform = { version = "32.0.1", path = "../sqry-lang-terraform", optional = true }
sqry-lang-puppet = { version = "32.0.1", path = "../sqry-lang-puppet", optional = true }
sqry-lang-pulumi = { version = "32.0.1", path = "../sqry-lang-pulumi", optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []
jvm-classpath = ["sqry-lang-java/jvm-classpath"]
plugin-apex = ["dep:sqry-lang-salesforce-apex"]
plugin-abap = ["dep:sqry-lang-sap-abap"]
plugin-servicenow-xanadu = ["dep:sqry-lang-servicenow-xanadu"]
plugin-servicenow-xml = ["dep:sqry-lang-servicenow-xml"]
plugin-terraform = ["dep:sqry-lang-terraform"]
plugin-puppet = ["dep:sqry-lang-puppet"]
plugin-pulumi = ["dep:sqry-lang-pulumi"]
specialty-plugins = [
    "plugin-apex",
    "plugin-abap",
    "plugin-servicenow-xanadu",
    "plugin-servicenow-xml",
    "plugin-terraform",
    "plugin-puppet",
    "plugin-pulumi",
]
