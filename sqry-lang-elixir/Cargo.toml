[package]
name = "sqry-lang-elixir"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Elixir language plugin for sqry"

[dependencies]
sqry-core = { version = "17.0.1", path = "../sqry-core" }
anyhow.workspace = true
tree-sitter.workspace = true
tree-sitter-elixir-sqry = { version = "17.0.1", path = "../crates/tree-sitter-elixir-sqry" }
streaming-iterator.workspace = true
tracing.workspace = true

[dev-dependencies]
log.workspace = true
sqry-core = { path = "../sqry-core", features = ["test-support"] }
insta = { version = "1.47", features = ["yaml"] }

[features]
default = ["has_relations"]
has_relations = []
