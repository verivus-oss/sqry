[package]
name = "sqry-lang-elixir"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Elixir language plugin for sqry"

[dependencies]
sqry-core = { path = "../sqry-core" }
anyhow.workspace = true
tree-sitter.workspace = true
tree-sitter-elixir.workspace = true
streaming-iterator.workspace = true
tracing.workspace = true

[dev-dependencies]
sqry-tree-sitter-fuzz-support = { path = "../sqry-tree-sitter-fuzz-support" }
log.workspace = true
sqry-core = { path = "../sqry-core", features = ["test-support"] }
insta = { version = "1.34", features = ["yaml"] }

[features]
default = ["has_relations"]
has_relations = []
