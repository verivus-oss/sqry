[package]
name = "sqry-lang-haskell"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Haskell language plugin for sqry"

[dependencies]
sqry-core = { version = "18.0.9", path = "../sqry-core" }
anyhow.workspace = true
log.workspace = true
tree-sitter.workspace = true
tree-sitter-haskell.workspace = true
streaming-iterator.workspace = true

[dev-dependencies]
sqry-core = { path = "../sqry-core", features = ["test-support"] }
tempfile.workspace = true

[features]
default = ["has_relations"]
has_relations = []
