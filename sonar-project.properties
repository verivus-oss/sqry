# Exclude test fixture files from test analysis.
# These are tree-sitter parser fixtures, not real tests. SonarQube's Java analyzer
# crashes on intentional edge-case code (e.g., self-referencing declarations).
sonar.test.exclusions=\
**/tests/fixtures/**

# Limit JS/TS analysis to the extension configs and avoid tooling artifacts.
sonar.javascript.tsconfigPaths=tools/sqry-vscode/tsconfig.json,tools/sqry-vscode/tsconfig.test.json
sonar.typescript.tsconfigPaths=tools/sqry-vscode/tsconfig.json,tools/sqry-vscode/tsconfig.test.json

# Keep scans focused on first-party source and avoid generated/binary-heavy directories.
# Java, PHP, and Python files are now included in scans (enabled 2025-01-29)
# Test fixtures remain excluded as they contain intentionally diverse/edge-case code
sonar.exclusions=\
**/target/**,\
**/node_modules/**,\
**/.git/**,\
**/.sqry-cache/**,\
**/.sqry-index*,\
**/.vscode-test/**,\
**/vendor/**,\
**/third-party/**,\
**/*.bundle,\
**/*.pdf,\
**/*.zip,\
**/*.bin,\
**/*.onnx,\
**/*.safetensors,\
**/tests/**,\
test-fixtures/**,\
tests/fixtures/**,\
**/tests/fixtures/**,\
**/tests/suite/**,\
**/.venv/**,\
**/malformed_syntax.*,\
**/large_file.*,\
**/*.sqry,\
models/**,\
archive/**,\
.tmp-sonar-javascript-plugin.jar,\
.claude/**,\
.sqry/**

# Exempt graph builders and language plugin libs from cognitive complexity rule (S3776)
# and empty block rule (S1858). These files traverse ASTs with large match statements
# where empty blocks for unhandled node types are intentional and expected.
# See docs/development/SONARQUBE_EXEMPTIONS.md for full rationale.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e16,e17,e18,e19,e20,e21,e22,e23,e24,e25,e26,e27,e28

# Exclude files from duplication detection (Copy-Paste Detector).
# - Test files: expected to have similar patterns across languages
# - graph_builder.rs: 34 language plugins with intentionally similar structure
# - Test fixtures: sample code for testing, not production code
# See: https://docs.sonarsource.com/sonarqube-server/project-administration/setting-analysis-scope/exclude-from-coverage-duplication
sonar.cpd.exclusions=\
**/tests/**/*.rs,\
**/graph_builder.rs,\
test-fixtures/**,\
tests/fixtures/**,\
benchmarks/**/*.rs,\
archive/**

# Code coverage integration using cargo-tarpaulin.
# Run: ./scripts/sonarqube/coverage.sh before scanning to generate coverage data.
# SonarQube Rust analyzer supports both LCOV and Cobertura formats.
# See: https://docs.sonarsource.com/sonarqube-server/analyzing-source-code/languages/rust
sonar.rust.lcov.reportPaths=coverage/lcov.info
sonar.rust.cobertura.reportPaths=coverage/cobertura.xml

# Note: If coverage data is not available, the default "Sonar Way" quality gate's
# 80% new code coverage threshold will fail. Either:
#   1. Run coverage.sh before scanning
#   2. Create a custom quality gate without coverage threshold
# See: https://docs.sonarsource.com/sonarqube/latest/project-administration/quality-gates/

# Exempt all graph_builder.rs files from cognitive complexity
sonar.issue.ignore.multicriteria.e1.ruleKey=rust:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/relations/graph_builder.rs

# Exempt language plugin lib.rs files from cognitive complexity
sonar.issue.ignore.multicriteria.e2.ruleKey=rust:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=**/sqry-lang-*/src/lib.rs

# Exempt loom tests from cognitive complexity; these are concurrency model checks.
sonar.issue.ignore.multicriteria.e3.ruleKey=rust:S3776
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*loom_tests*.rs

# Exempt graph_builder.rs files from empty block rule (S1858)
# AST traversal requires handling all node types; empty blocks for unhandled types are intentional
sonar.issue.ignore.multicriteria.e4.ruleKey=rust:S1858
sonar.issue.ignore.multicriteria.e4.resourceKey=**/relations/graph_builder.rs

# Exempt language plugin lib.rs files from empty block rule
sonar.issue.ignore.multicriteria.e5.ruleKey=rust:S1858
sonar.issue.ignore.multicriteria.e5.resourceKey=**/sqry-lang-*/src/lib.rs

# Exempt external Cargo source code documentation from empty block rule
sonar.issue.ignore.multicriteria.e6.ruleKey=rust:S1858

# Exempt lifetime_extractor.rs from empty block rule (AST traversal for Rust lifetime analysis)
sonar.issue.ignore.multicriteria.e7.ruleKey=rust:S1858
sonar.issue.ignore.multicriteria.e7.resourceKey=**/lifetime_extractor.rs

# Exempt Java test fixtures from package naming rule (S1598)
# These are test fixtures used for AST parsing validation, not production Java code.
# The files are in correct Maven-style directories but the SonarQube Java analyzer
# does not resolve source roots within test fixture directories.
sonar.issue.ignore.multicriteria.e8.ruleKey=java:S1598
sonar.issue.ignore.multicriteria.e8.resourceKey=**/tests/fixtures/**/*.java

# Exempt repo-root Java test fixtures from package naming rule
sonar.issue.ignore.multicriteria.e9.ruleKey=java:S1598
sonar.issue.ignore.multicriteria.e9.resourceKey=tests/fixtures/**/*.java

