[package]
name = "sqry-lang-sap-abap"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "SAP ABAP language plugin for sqry - semantic search with SAP-specific metadata"

[lib]
name = "sqry_lang_sap_abap"
path = "src/lib.rs"

[dependencies]
sqry-core = { version = "16.0.6", path = "../sqry-core" }
tree-sitter = { workspace = true }
tree-sitter-abap-sqry = { version = "16.0.6", path = "../crates/tree-sitter-abap-sqry" }
streaming-iterator = { workspace = true }

[dev-dependencies]
sqry-core = { path = "../sqry-core", features = ["test-support"] }
tempfile.workspace = true

[features]
default = ["has_relations"]
has_relations = []

[lints]
workspace = true
